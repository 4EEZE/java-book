[[questions]]
id = "2da7201c-1fba-4b33-96f7-76b076a192cc"
type = "Tracing"
prompt.program = """
import java.util.ArrayList;
import java.util.List;

void main() {
    List<String> strings = new ArrayList<>();
    List<Integer> numbers = new ArrayList<>();
    IO.println(strings.getClass() == numbers.getClass());
}
"""
answer.doesCompile = true
answer.stdout = "true"
context = """
Во время работы программы `List<String>` и `List<Integer>` — один и тот же тип:
`java.util.ArrayList`. Угловые скобки существуют только для компилятора, а
после проверок он **стирает** информацию о параметре.

Отсюда все ограничения обобщённых типов в Java: они работают до запуска, а не
во время.
"""

