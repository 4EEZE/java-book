type = "MultipleChoice"
prompt.prompt = """
Почему `new T[10]` внутри класса `Box<T>` не компилируется?
"""
answer.answer = "Массив во время работы проверяет тип записываемых элементов, а `T` к этому моменту стёрт — проверять нечего."
prompt.distractors = [
  "Размер массива обобщённого типа нельзя задавать числом.",
  "Массивы вообще нельзя создавать внутри обобщённых классов.",
  "Обобщённый массив создаётся другим синтаксисом, с пустыми фигурными скобками."
]
context = """
Сообщение: `generic array creation`. Вместо массива берут `List<T>` — у него
проверка типов происходит при компиляции и стирание ей не мешает.

По той же причине нельзя написать `o instanceof List<String>`: информации о
параметре во время работы уже нет.
"""

[[questions]]
id = "caf09e8c-9cd4-4918-97f5-ffbb243df1f3"
type = "Tracing"
prompt.program = """
import java.util.List;

<T extends Comparable<T>> T max(List<T> items) {
    T best = items.get(0);
    for (T item : items) {
        if (item.compareTo(best) > 0) {
            best = item;
        }
    }
    return best;
}

void main() {
    IO.println(max(List.of(3, 7, 5)));
    IO.println(max(List.of("б", "я", "а")));
}
"""
answer.doesCompile = true
answer.stdout = """
7
я
"""
context = """
`<T extends Comparable<T>>` требует от типа умения сравниваться с собой — только
поэтому `item.compareTo(best)` законен. Без ограничения компилятор знал бы о `T`
лишь то, что это объект, и метода `compareTo` не нашёл бы.

Один метод обслужил и числа, и строки: обобщённый метод сохраняет тип сквозь
себя, поэтому возвращается именно `Integer` и именно `String`.
"""
