[[questions]]
id = "fea3d3ff-0897-4422-af12-e5f347190229"
type = "MultipleChoice"
prompt.prompt = """
Зачем в Maven-проекте нужен каталог `src/main/java`, если можно было положить
исходники прямо в корень?
"""
answer.answer = "Чтобы отделить код программы от тестов и прочих ресурсов: сборщик обрабатывает эти каталоги по-разному."
prompt.distractors = [
  "Этого требует компилятор `javac`.",
  "Так быстрее работает компиляция.",
  "Так требует спецификация языка Java."
]
context = """
Ни компилятор, ни язык про эти каталоги ничего не знают — это соглашение
Maven. Смысл его в том, что код из `src/test/java` должен компилироваться и
запускаться при `mvn test`, но не попадать в итоговый JAR.
"""

[[questions]]
id = "4a970dd6-1eef-47d5-ad87-3a7562b3e80d"
type = "ShortAnswer"
prompt.prompt = """
Какой командой Maven собрать проект в JAR, предварительно удалив результаты
прошлой сборки? Напишите команду целиком.
"""
answer.answer = "mvn clean package"
answer.alternatives = ["mvn clean install"]
context = """
`clean` удаляет каталог `target`, `package` собирает заново. Порядок важен:
Maven выполняет фазы слева направо.
"""

[[questions]]
id = "12cae2a7-0392-4add-b8c4-1999dad383f3"
type = "MultipleChoice"
prompt.prompt = """
Вы добавили в `pom.xml` зависимость от Jackson. Jackson, в свою очередь, сам
зависит от нескольких библиотек. Что нужно сделать с этими библиотеками?
"""
answer.answer = "Ничего — Maven определит и скачает их сам."
prompt.distractors = [
  "Добавить каждую из них в `pom.xml` отдельной записью.",
  "Скачать их вручную и положить в каталог `lib`.",
  "Перечислить их в флаге `-cp` при запуске."
]
context = """
Разрешение транзитивных зависимостей — главная причина, по которой сборщиком
пользуются вместо `javac` с флагом `-cp`. Каждая библиотека описывает свои
зависимости в собственном `pom.xml`, и Maven обходит этот граф целиком.
"""
