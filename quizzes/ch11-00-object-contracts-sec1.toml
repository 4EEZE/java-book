[[questions]]
id = "2337a86d-de00-4a3c-a961-2bab5e1126db"
type = "Tracing"
prompt.program = """
import java.util.HashSet;
import java.util.Set;

class Point {
    final int x, y;
    Point(int x, int y) { this.x = x; this.y = y; }

    @Override
    public boolean equals(Object o) {
        return o instanceof Point p && p.x == x && p.y == y;
    }
}

void main() {
    Point a = new Point(1, 2);
    Point b = new Point(1, 2);

    IO.println(a.equals(b));

    Set<Point> set = new HashSet<>();
    set.add(a);
    IO.println(set.contains(b));
    set.add(b);
    IO.println(set.size());
}
"""
answer.doesCompile = true
answer.stdout = """
true
false
2
"""
context = """
`equals` переопределён, `hashCode` — нет. Поиск в `HashSet` идёт не перебором:
сначала `hashCode()` указывает ячейку, и только внутри неё сравниваются
элементы. Разные хеши отправили равные точки в разные ячейки, и до `equals`
дело вообще не дошло.

В итоге множество без повторов содержит два одинаковых элемента. Отсюда
правило: переопределяя `equals`, всегда переопределяйте `hashCode`.
"""

[[questions]]
id = "53568e67-c723-470c-a38a-7a6caf988c3b"
type = "MultipleChoice"
prompt.prompt = """
Корректен ли `hashCode()`, который всегда возвращает `0`, при правильно
написанном `equals`?
"""
answer.answer = "Корректен: контракт соблюдён и программа работает правильно, но словарь и множество резко замедляются."
prompt.distractors = [
  "Некорректен: контракт требует, чтобы разные объекты давали разные хеши.",
  "Корректен и на скорость не влияет: хеш нужен только для равенства.",
  "Некорректен: такой код не скомпилируется."
]
context = """
Контракт требует лишь одного в эту сторону: равные объекты дают равные хеши.
Ноль это условие выполняет. Коллизии — когда неравные объекты получают
одинаковый хеш — разрешены.

Но все элементы попадут в одну ячейку, и поиск из вычисления превратится в
перебор: `HashMap` с миллионом записей станет работать как список.

`hashCode` отвечает за скорость, `equals` — за правильность. Плохой `hashCode`
замедляет, неверный — ломает.
"""

[[questions]]
id = "f26816e1-a352-40c3-80cf-07329fb09c76"
type = "ShortAnswer"
prompt.prompt = """
Каким методом из класса `Objects` вычисляют `hashCode` по набору полей, не
выписывая формулу руками? Напишите имя метода.
"""
answer.answer = "hash"
answer.alternatives = ["Objects.hash", "hash()"]
context = """
`return Objects.hash(x, y);` — достаточно перечислить те же поля, что участвуют
в `equals`. Наборы полей у этих двух методов обязаны совпадать.
"""
