[[questions]]
id = "ac36a95a-0d35-4b1b-8411-1564012989ae"
type = "Tracing"
prompt.program = """
interface Describable {
    String describe();
}

class Book implements Describable {
    public String describe() { return "книга"; }
}

class Film implements Describable {
    public String describe() { return "фильм"; }
}

void main() {
    Describable item = new Film();
    IO.println(item.describe());
}
"""
answer.doesCompile = true
answer.stdout = "фильм"
context = """
Переменная объявлена как `Describable`, но хранит `Film`, и вызывается метод
настоящего объекта. Тип переменной решает, что **можно** вызвать; фактический
тип объекта решает, что **вызовется**.

Выбор происходит во время работы программы, а не при компиляции, — это и есть
динамическая диспетчеризация.
"""

[[questions]]
id = "a52a80df-2b63-45a2-b3b7-ff2df5e3177d"
type = "MultipleChoice"
prompt.prompt = """
Почему `new Describable()` не компилируется, если `Describable` — интерфейс с
единственным методом `describe()`?
"""
answer.answer = "У интерфейса нет реализации `describe()`, поэтому непонятно, что вызовется у такого объекта."
prompt.distractors = [
  "Интерфейс можно создать только через `implements`.",
  "У интерфейса нет конструктора, но его можно добавить.",
  "Интерфейсы создаются только внутри того же файла."
]
context = """
Сообщение: `Describable is abstract; cannot be instantiated`. Интерфейс
описывает, что объект умеет, и ничего не говорит о том, как. Создавать объект
без реализации бессмысленно.
"""

[[questions]]
id = "e5678999-c10e-4066-b0a2-bb7c06c92e66"
type = "MultipleChoice"
prompt.prompt = """
Что произойдёт, если при реализации интерфейса опечататься в имени метода
(написать `descrbe()` вместо `describe()`) и **не** поставить `@Override`?
"""
answer.answer = "Ошибка компиляции: класс не реализовал метод интерфейса."
prompt.distractors = [
  "Программа скомпилируется, а при вызове `describe()` упадёт.",
  "Программа скомпилируется и вызовет метод с опечаткой.",
  "Ничего: компилятор сопоставит методы по подписи, а не по имени."
]
context = """
Здесь ошибку поймает сам интерфейс: `does not override abstract method
describe()`. Метод с опечаткой станет просто лишним методом класса.

`@Override` нужна для другого случая — когда переопределяемый метод
**не** обязателен. Например, при наследовании класса: опечатка создаст новый
метод вместо переопределения, и компилятор промолчит. Аннотация просит его
проверить, что метод действительно что-то переопределяет, поэтому ставить её
стоит всегда.
"""

[[questions]]
id = "fe00fe42-1cc6-450d-9d65-c755d5c9fc26"
type = "Tracing"
prompt.program = """
interface Greeter {
    String name();

    default String greet() {
        return "Привет, " + name() + "!";
    }
}

class Friend implements Greeter {
    public String name() { return "Аня"; }
}

void main() {
    IO.println(new Friend().greet());
}
"""
answer.doesCompile = true
answer.stdout = "Привет, Аня!"
context = """
`greet()` в классе не объявлен, но достался ему от интерфейса как метод по
умолчанию. При этом сам `greet()` вызывает `name()`, не зная, как тот устроен, —
интерфейс опирается на собственное обещание.
"""

[[questions]]
id = "02d358e7-be00-47b3-ab2c-c21cbad5ec0a"
type = "MultipleChoice"
prompt.prompt = """
Классу нужно общее с «родственниками» **состояние** — поле, которое задаётся при
создании. Что выбрать: интерфейс или абстрактный класс?
"""
answer.answer = "Абстрактный класс: у интерфейса нет ни полей с состоянием, ни конструктора."
prompt.distractors = [
  "Интерфейс: поля можно объявить в нём и заполнить в реализации.",
  "Всё равно: с Java 8 интерфейсы умеют хранить состояние через `default`.",
  "Интерфейс, потому что абстрактный класс нельзя создать через `new`."
]
context = """
Решающее различие обычно другое: класс наследует ровно один класс, но реализует
сколько угодно интерфейсов. Поэтому интерфейс — выбор по умолчанию, а
абстрактный класс берут именно тогда, когда наследникам нужно общее состояние.

Методы `default` состояния не дают: они лишь дают реализацию поведения.
"""

[[questions]]
id = "787bf2a3-1289-42e3-950b-052b75b053ee"
type = "MultipleChoice"
prompt.prompt = """
В `compareTo` написали `return this.year - other.year;` вместо
`Integer.compare(this.year, other.year)`. Когда это сломается?
"""
answer.answer = "Когда разность лет выйдет за диапазон `int` и переполнится, дав знак, обратный правильному."
prompt.distractors = [
  "Никогда: для годов разность работает всегда.",
  "Когда годы равны: разность даст ноль, а нужен положительный результат.",
  "Когда один из годов отрицательный: вычитание отрицательных запрещено."
]
context = """
Для годов разность и правда не переполнится, но приём переносят на другие поля —
на метки времени, на суммы, — и там она переполняется молча, как мы разбирали в
главе 3. Отсортированный список окажется перемешан, и никто не сообщит об ошибке.

`Integer.compare` считает то же самое без вычитания и потому безопасен всегда.
Ноль, кстати, — правильный ответ для равных значений: он означает «равны по
порядку».
"""
