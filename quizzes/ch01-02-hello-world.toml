[[questions]]
id = "ff6547d0-147e-4703-96b5-9582213c23d7"
type = "MultipleChoice"
prompt.prompt = """
Что произойдёт, если переименовать метод `main` в `start` и запустить программу?
"""
answer.answer = "Программа не запустится: виртуальная машина не найдёт точку входа."
prompt.distractors = [
  "Программа запустится, выполнение начнётся с метода `start`.",
  "Программа не скомпилируется.",
  "Программа запустится, но ничего не напечатает."
]
context = """
Код при этом вполне корректен — компилятор на него не жалуется. Проблема
возникает на шаг позже: виртуальная машина ищет метод со строго определённым
именем `main`, не находит его и завершается с ошибкой. Это разница между
«код неправильный» и «код правильный, но не является программой».
"""

[[questions]]
id = "3c2d6072-57a6-4f84-a166-6c6ab42ac64d"
type = "MultipleChoice"
prompt.prompt = """
В чём разница между `javac Hello.java` и `java Hello.java`?
"""
answer.answer = "Первая команда создаёт на диске файл `Hello.class`, вторая компилирует в памяти и сразу запускает."
prompt.distractors = [
  "Первая компилирует в машинный код, вторая — в байт-код.",
  "Первая работает только с классической формой, вторая — только с короткой.",
  "Разницы нет, это синонимы."
]
context = """
Компиляция происходит в обоих случаях — в байт-код, а не в машинный код.
Различие в том, сохраняется ли результат на диск. Запуск исходника удобен для
маленьких программ; для проекта из многих файлов нужна обычная компиляция.
"""

[[questions]]
id = "40eb5382-d427-4b41-8514-27beea540725"
type = "Tracing"
prompt.program = """
void main() {
    IO.print("Привет, ");
    IO.println("мир!");
    IO.println("Пока.");
}
"""
answer.doesCompile = true
answer.stdout = """
Привет, мир!
Пока.
"""
context = """
`print` печатает без перевода строки, поэтому первые две строки кода дают одну
строку вывода. `println` в конце переводит строку, поэтому «Пока.» начинается
с новой.
"""

[[questions]]
id = "1c09c3cc-e327-4fa6-a7e8-7aca2f2f1b08"
type = "MultipleChoice"
prompt.prompt = """
В программе пропущена точка с запятой:

```java
void main() {
    IO.println("раз")
    IO.println("два");
}
```

Что она напечатает при запуске `java hello.java`?
"""
answer.answer = "Ничего: компилятор откажется собирать программу, и она не запустится."
prompt.distractors = [
  "`раз` и `два` — компилятор подставит точку с запятой сам.",
  "`раз`, а потом сообщение об ошибке.",
  "Только `два`: первая строка будет пропущена."
]
context = """
Ошибка компиляции означает, что исполняемого кода не появилось вовсе. Ни одна
строка не выполнится — программа не запускалась ни на секунду.

Это ключевое отличие от ошибки времени выполнения: там программа работает и
печатает всё до места сбоя.
"""

