[[questions]]
id = "6200b396-5945-4baa-8442-411a66ad09d6"
type = "MultipleChoice"
prompt.prompt = """
Метод объявлен без модификатора доступа: `String internalNote() { ... }`.
Кто его видит?
"""
answer.answer = "Свой класс и любой класс того же пакета — но не из других пакетов."
prompt.distractors = [
  "Только свой класс, как при `private`.",
  "Все, как при `public`: отсутствие модификатора ничего не ограничивает.",
  "Свой класс и его наследники в любых пакетах."
]
context = """
Это **пакетно-приватный** уровень — единственный, у которого нет ключевого
слова. Из другого пакета получите
`is not public in Book; cannot be accessed from outside package`.

Уровень полезнее, чем кажется: классы одного пакета сотрудничают тесно, наружу
выходит только нужное. Пакет превращается из каталога в границу.
"""

[[questions]]
id = "29a97304-8188-4ea4-9b69-4e08b3ae4dc3"
type = "MultipleChoice"
prompt.prompt = """
Почему `public` не стоит ставить по умолчанию, раз он ничему не мешает?
"""
answer.answer = "Всё публичное придётся поддерживать: у него появятся пользователи, и менять сигнатуру станет нельзя."
prompt.distractors = [
  "`public`-методы работают медленнее из-за дополнительных проверок доступа.",
  "`public` запрещает наследование класса в других пакетах.",
  "Компилятор выдаёт предупреждение на каждый лишний `public`."
]
context = """
Разумный порядок обратный: начинайте с самого закрытого уровня и расширяйте по
необходимости. `private`, пока хватает; пакетно-приватный, когда нужен соседу;
`public`, только если это действительно часть внешнего лица вашего кода.
"""

[[questions]]
id = "b9106bb5-cfd8-4512-93f8-1c1360d1f2e1"
type = "MultipleChoice"
prompt.prompt = """
Две подключённые библиотеки требуют разные версии одной общей зависимости. Чем
это опасно и когда проявится?
"""
answer.answer = "В classpath попадёт одна версия, и библиотека, рассчитанная на другую, упадёт с `NoSuchMethodError` во время работы, а не при сборке."
prompt.distractors = [
  "Сборка не пройдёт: Maven откажется разрешать конфликт версий.",
  "Обе версии загрузятся параллельно, и поведение станет случайным.",
  "Ничем: Maven всегда берёт более новую версию, и она совместима со старой."
]
context = """
Maven разрешает конфликт правилом ближайшего: побеждает версия, до которой
короче путь в дереве зависимостей. Это не гарантирует совместимости.

Посмотреть дерево: `mvn dependency:tree`. Лечится явным указанием нужной версии
в своём `pom.xml` — объявленное у вас всегда побеждает.
"""

[[questions]]
id = "1529a3fa-1278-4683-a702-160c13414f44"
type = "MultipleChoice"
prompt.prompt = """
Что делает строка `exports ru.example.model;` в файле `module-info.java`?
"""
answer.answer = "Открывает этот пакет наружу; неперечисленные пакеты недоступны извне, даже если классы в них `public`."
prompt.distractors = [
  "Подключает пакет из другого модуля, как `import`.",
  "Копирует классы пакета в итоговый JAR при сборке.",
  "Делает все классы пакета `public` автоматически."
]
context = """
Подключение — это `requires`, а `exports` работает в обратную сторону. В этом и
смысл модулей: пакет скрывает члены классов, но сам пакет доступен всем, кто
подключил ваш JAR. Модуль закрывает и это.

Для прикладных проектов модули прижились слабо: модульным должен быть весь граф
зависимостей, а одна старая библиотека тянет сборку обратно в classpath.
"""

[[questions]]
id = "f07ae854-6a13-4cc1-bd06-6003d0428ac5"
type = "MultipleChoice"
prompt.prompt = """
Зачем имена пакетов записывают как доменное имя наоборот — `ru.example.app`?
"""
answer.answer = "Ради глобальной уникальности: домен принадлежит одному владельцу, значит и пакет тоже."
prompt.distractors = [
  "Так требует компилятор: имя пакета обязано содержать точки.",
  "Чтобы Maven мог скачать библиотеку по этому адресу из интернета.",
  "Ради скорости: обратный порядок ускоряет поиск класса при загрузке."
]
context = """
Полное имя класса включает пакет, поэтому `ru.example.model.Book` и
`com.library.Book` — разные типы, и конфликта имён не возникает.

Внутри пакеты обычно делят по назначению (`model`, `storage`, `web`), а не по
виду класса: так связанные вещи лежат рядом.
"""

[[questions]]
id = "97c75250-02f5-4c22-ac9f-9155d72e4f65"
type = "ShortAnswer"
prompt.prompt = """
Какой командой Maven показывает дерево зависимостей вместе с транзитивными?
Напишите команду целиком.
"""
answer.answer = "mvn dependency:tree"
context = """
Первое, что стоит сделать при загадочном `NoSuchMethodError`: посмотреть, какая
версия общей зависимости победила и откуда она пришла.
"""
