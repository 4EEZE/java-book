[[questions]]
id = "a9cfc1d8-13c3-4968-8008-b720df95c32f"
type = "MultipleChoice"
prompt.prompt = """
Какой тип у лямбды `(x, y) -> Integer.compare(x.length(), y.length())`,
переданной в `items.sort(...)`?
"""
answer.answer = "`Comparator<String>` — лямбда реализует его единственный абстрактный метод."
prompt.distractors = [
  "Особый встроенный тип `lambda`, не связанный с интерфейсами.",
  "`Function<String, Integer>` — она принимает строки и возвращает число.",
  "Тип выводится во время работы программы и заранее не определён."
]
context = """
Лямбда — это реализация интерфейса, у которого ровно **один** абстрактный метод;
такой интерфейс называют функциональным. Записывая лямбду, вы создаёте объект,
реализующий этот метод.

Поэтому одна и та же лямбда в разных местах может иметь разный тип: важно, чего
ждёт принимающая сторона.
"""

[[questions]]
id = "7507cfa6-df67-4c1b-a787-22838516a042"
type = "MultipleChoice"
prompt.prompt = """
Почему этот код не компилируется?

```java
int count = 0;
Supplier<Integer> get = () -> count;
count = 5;
```
"""
answer.answer = "Захваченная лямбдой переменная обязана быть фактически финальной — не меняться после присваивания."
prompt.distractors = [
  "Лямбда не может обращаться к переменным метода, только к полям объекта.",
  "`Supplier` не умеет работать с примитивами, нужен `Supplier<int>`.",
  "Переменную нужно объявить до лямбды, а не использовать в ней напрямую."
]
context = """
Сообщение: `local variables referenced from a lambda expression must be final or
effectively final`.

Причина в главе 4: лямбда может пережить метод, в котором создана, а локальная
переменная живёт в кадре вызова, который к тому времени уничтожен. Лямбда
получает копию — и если бы оригинал менялся, копия молча разошлась бы с ним.
"""

[[questions]]
id = "4a6fecc4-e9bd-433c-aaa0-e0186d16cbd6"
type = "Tracing"
prompt.program = """
import java.util.function.Function;

void main() {
    String prefix = "Привет, ";
    Function<String, String> greet = name -> prefix + name;
    IO.println(greet.apply("Аня"));
}
"""
answer.doesCompile = true
answer.stdout = "Привет, Аня"
context = """
`prefix` в лямбду не передавалась — она **захвачена** из окружения. Это
называют замыканием.

Здесь захват законен: после присваивания переменная не меняется, то есть она
фактически финальная.
"""

[[questions]]
id = "b05cda74-8a52-4761-aaff-f5d8e0217c91"
type = "MultipleChoice"
prompt.prompt = """
Что делает аннотация `@FunctionalInterface` на интерфейсе?
"""
answer.answer = "Просит компилятор проверить, что абстрактный метод ровно один; на поведение программы не влияет."
prompt.distractors = [
  "Разрешает использовать интерфейс в качестве типа лямбды — без неё нельзя.",
  "Запрещает интерфейсу иметь методы по умолчанию.",
  "Заставляет компилятор создать реализацию интерфейса автоматически."
]
context = """
Это аннотация в духе `@Override` из главы 6: она ничего не меняет, но ловит
ошибку рано. Добавите второй абстрактный метод — получите
`Unexpected @FunctionalInterface annotation` сразу, а не там, где перестанет
работать лямбда.

Лямбду можно писать и для интерфейса без этой аннотации — достаточно, чтобы
абстрактный метод был один.
"""

[[questions]]
id = "0323dc2e-d84d-4aa0-9fe4-03998fcdcdac"
type = "ShortAnswer"
prompt.prompt = """
Запишите лямбду `s -> s.length()` в виде ссылки на метод.
"""
answer.answer = "String::length"
context = """
Двоеточий два, аргументы не пишутся вовсе: «вот метод, вызывайте его сами».

Ссылка короче, но не всегда понятнее. Берите её, когда имя метода само объясняет
происходящее, и оставляйте лямбду, когда важнее показать, откуда берётся
аргумент.
"""

[[questions]]
id = "a94e0d72-4733-41cf-8ee4-5398f7d28e36"
type = "MultipleChoice"
prompt.prompt = """
Чем лямбда отличается от анонимного класса с точки зрения того, что происходит
при выполнении?
"""
answer.answer = "Анонимный класс — отдельный `.class`-файл и новый объект на каждое выполнение; лямбда компилируется в особую инструкцию, и без захваченных переменных её объект может переиспользоваться."
prompt.distractors = [
  "Разницы нет: компилятор превращает лямбду в анонимный класс.",
  "Лямбда выполняется в отдельном потоке, анонимный класс — в текущем.",
  "Лямбда вычисляется при компиляции, анонимный класс — во время работы."
]
context = """
Практический вывод один: лямбды дешевле анонимных классов, и избегать их из
опасений за скорость не нужно.
"""
