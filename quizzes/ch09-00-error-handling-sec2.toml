[[questions]]
id = "0901fbbe-2121-4373-978d-8034388300eb"
type = "MultipleChoice"
prompt.prompt = """
Почему `catch (RuntimeException e)` нельзя поставить **раньше**
`catch (IllegalArgumentException e)` в одном `try`?
"""
answer.answer = "`RuntimeException` забрал бы и `IllegalArgumentException` тоже, и вторая ветка стала бы недостижимой."
prompt.distractors = [
  "Порядок `catch` не важен: Java выбирает наиболее точное совпадение.",
  "`RuntimeException` непроверяемое, а такие ветки всегда идут последними.",
  "В одном `try` нельзя ловить два исключения из одной иерархии."
]
context = """
Сообщение компилятора: `exception IllegalArgumentException has already been
caught`. Ветки проверяются сверху вниз, срабатывает первая подходящая, поэтому
узкий тип обязан идти раньше широкого.

Это та же логика, что у образцов в `switch` из главы 7, — там компилятор
говорит про ветку, «перекрытую предыдущей».
"""

[[questions]]
id = "d2de7032-51b8-4cd3-b6e4-eb9188404052"
type = "MultipleChoice"
prompt.prompt = """
Чем проверяемое исключение отличается от непроверяемого — с точки зрения того,
что означает его появление в программе?
"""
answer.answer = "Проверяемое — ожидаемая неприятность внешнего мира (файла нет, сеть недоступна). Непроверяемое обычно означает ошибку в логике, которую надо исправить."
prompt.distractors = [
  "Проверяемое можно перехватить, непроверяемое — нельзя.",
  "Проверяемое возникает при компиляции, непроверяемое — при работе программы.",
  "Проверяемое наследует `Error`, непроверяемое — `Exception`."
]
context = """
Отсюда и разное отношение компилятора. `IOException` он требует обработать:
файла может не быть, и это нормальный ход событий. А `NullPointerException`
требовать обрабатывать бессмысленно — программу надо починить, а не
обрабатывать её дефект.

Перехватить, кстати, можно любое исключение. Различие в том, **обязывает** ли
компилятор это сделать.
"""

[[questions]]
id = "867c5e8f-bff2-4b7b-80a5-e04e5dbafbf1"
type = "MultipleChoice"
prompt.prompt = """
Чем плох пустой `catch`?

```java
try {
    save(data);
} catch (IOException e) {
}
```
"""
answer.answer = "Данные не сохранились, а программа продолжает работать как будто всё хорошо — и следов не остаётся нигде."
prompt.distractors = [
  "Он не скомпилируется: в `catch` обязана быть хотя бы одна инструкция.",
  "Он замедляет программу, потому что исключение всё равно создаётся.",
  "Ничем: если обрабатывать нечего, пустой `catch` — правильный выбор."
]
context = """
Компилятор пустой `catch` разрешает, и именно в этом беда: такие места ищут
потом сутками.

Правило простое — перехватывайте исключение только если знаете, что с ним
делать: повторить, подставить запасное значение, понятно сообщить или перевести
в другой вид. Не подходит ни один вариант — не ловите. Исключение, прошедшее
наверх, остановит программу с внятным сообщением, и это лучше, чем работа в
испорченном состоянии.
"""

[[questions]]
id = "b5289a0c-ea63-4ec7-87ca-963fc692e89a"
type = "ShortAnswer"
prompt.prompt = """
Исходное исключение передали вторым аргументом в конструктор нового. Под какой
пометкой оно появится в трассировке? Напишите два слова.
"""
answer.answer = "Caused by"
answer.alternatives = ["Caused by:", "caused by"]
context = """
Без передачи причины вы получите «не прочитали настройки» и никакого понятия,
почему. С ней в трассировке сохранится путь до настоящего источника — например,
`Caused by: java.nio.file.NoSuchFileException`.
"""
