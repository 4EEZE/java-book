[[questions]]
id = "f1b2dff3-9374-438c-8445-f95c9c19644f"
type = "Tracing"
prompt.program = """
enum Status {
    NEW("новый"), DONE("готово");

    private final String label;
    Status(String label) { this.label = label; }
    String label() { return label; }
}

void main() {
    IO.println(Status.NEW);
    IO.println(Status.NEW.label());
    IO.println(Status.valueOf("DONE").label());
}
"""
answer.doesCompile = true
answer.stdout = """
NEW
новый
готово
"""
context = """
`toString` у перечисления по умолчанию возвращает имя варианта — `NEW`, а не
значение поля. Поле отдаёт только явно объявленный метод.

`valueOf` ищет вариант по имени и бросает `IllegalArgumentException`, если такого
нет.
"""

[[questions]]
id = "71ad1eb1-c84f-4313-a8a5-50db58806d15"
type = "MultipleChoice"
prompt.prompt = """
Почему `ordinal()` не стоит сохранять в базу данных как код статуса?
"""
answer.answer = "Добавите вариант в середину списка — номера сдвинутся, а сохранённые данные останутся старыми."
prompt.distractors = [
  "`ordinal()` возвращает разные значения при каждом запуске программы.",
  "`ordinal()` недоступен, если у перечисления есть свой конструктор.",
  "Он возвращает `long`, который не помещается в обычный целочисленный столбец."
]
context = """
Порядковый номер — следствие порядка объявления, а не свойство варианта.
Храните имя: оно меняется только тогда, когда вы сами его переименуете, и такое
изменение хотя бы заметно.
"""

[[questions]]
id = "92caa216-8d29-4a74-94a9-fe34f77a70ae"
type = "MultipleChoice"
prompt.prompt = """
Аннотация объявлена с `@Retention(RetentionPolicy.SOURCE)`. Сможет ли библиотека
найти помеченные ею методы во время работы программы?
"""
answer.answer = "Нет: такая аннотация не попадает даже в class-файл и доступна только компилятору."
prompt.distractors = [
  "Да, если библиотека читает её через `getAnnotation`.",
  "Да, но только для публичных методов.",
  "Нет, но её можно прочитать, если включить `--enable-preview`."
]
context = """
Именно поэтому `@Override` объявлена с `SOURCE` — она нужна только компилятору, —
а `@Test` с `RUNTIME`, иначе JUnit не смог бы найти тесты.

Выбор `@Retention` — первое, что решают, объявляя свою аннотацию.
"""

[[questions]]
id = "7133dfe2-f9c4-440b-900b-4eafcb9313d0"
type = "MultipleChoice"
prompt.prompt = """
Почему рефлексию не советуют применять в обычном прикладном коде?
"""
answer.answer = "Она обходит проверку типов, ломает переименование в IDE, работает медленнее и позволяет пролезть в приватные члены."
prompt.distractors = [
  "Она требует особых прав и по умолчанию отключена.",
  "Она работает только с классами из стандартной библиотеки.",
  "Она несовместима с обобщёнными типами из-за стирания."
]
context = """
Ошибка в `method.invoke(app)` вылезет во время работы, а не при компиляции, и
переименованный метод IDE в строке не найдёт.

Место рефлексии — каркасы, загрузчики модулей, сериализация: там, где типы
действительно неизвестны на момент компиляции. Если задача решается интерфейсом
или перечислением, решайте ими.
"""

[[questions]]
id = "1315d7e9-f6a1-498e-ae60-2cb005972646"
type = "MultipleChoice"
prompt.prompt = """
Вложенный класс не обращается к полям внешнего. Почему его стоит объявить
`static`?
"""
answer.answer = "Нестатический держит невидимую ссылку на внешний объект и не даёт сборщику мусора его освободить."
prompt.distractors = [
  "Без `static` класс нельзя объявить публичным.",
  "Без `static` он компилируется в отдельный файл и замедляет загрузку.",
  "`static` требуется, чтобы у вложенного класса был собственный конструктор."
]
context = """
Пока жив хотя бы один экземпляр внутреннего класса, внешний объект не может быть
собран, даже если больше никому не нужен. Это утечка ровно того вида, что в
главе 4: ссылка живёт дольше, чем нужен объект.
"""

[[questions]]
id = "124b9ded-0d0f-4edb-933d-faa9f54787db"
type = "MultipleChoice"
prompt.prompt = """
Когда выбирать перечисление, а когда запечатанный тип из главы 7?
"""
answer.answer = "Перечисление — когда вариантов конечное число и у них нет своих данных; запечатанный тип — когда у каждого варианта своя структура."
prompt.distractors = [
  "Перечисление — для внутренних типов, запечатанный — для публичных.",
  "Перечисление быстрее, поэтому его берут всегда, когда вариантов меньше десяти.",
  "Они взаимозаменяемы: `switch` по ним работает одинаково."
]
context = """
Круг и прямоугольник из главы 7 несут разные поля — это запечатанный тип.
Статусы задачи различаются только собой — это перечисление.

Общее у них то, ради чего оба и нужны: компилятор знает все варианты и проверяет
`switch` на полноту.
"""
