[[questions]]
id = "b9745c86-374b-4b88-a495-85c129d23eaf"
type = "Tracing"
prompt.program = """
void main() {
    int number = 1;
    change(number);
    IO.println(number);
}

void change(int value) {
    value = 99;
}
"""
answer.doesCompile = true
answer.stdout = "1"
context = """
Параметры в Java передаются по значению: метод получил копию числа и изменил
её. Оригинальная переменная не пострадала.
"""

[[questions]]
id = "05e6370c-3876-4979-b47e-81ca537d31aa"
type = "Tracing"
prompt.program = """
void main() {
    int[] array = {1, 2, 3};
    change(array);
    IO.println(array[0]);
}

void change(int[] values) {
    values[0] = 99;
}
"""
answer.doesCompile = true
answer.stdout = "99"
context = """
Правило то же — передаётся копия. Но переменная хранит не массив, а **ссылку**
на него. Скопировали ссылку, и обе указывают на один массив; изменение элемента
через копию видно через оригинал.
"""

[[questions]]
id = "3d3ef5ba-07be-4bd1-90df-6c3962bf513d"
type = "Tracing"
prompt.program = """
void main() {
    int[] array = {1, 2, 3};
    replace(array);
    IO.println(array[0]);
}

void replace(int[] values) {
    values = new int[] {99, 99, 99};
}
"""
answer.doesCompile = true
answer.stdout = "1"
context = """
Здесь метод не меняет массив, а перенаправляет свою копию ссылки на новый.
Оригинальная переменная как указывала на старый массив, так и указывает.

Сравните с предыдущим вопросом: разница между «изменить то, на что указывает
ссылка» и «перенаправить ссылку» — тема всей четвёртой главы.
"""

[[questions]]
id = "5556da2f-51a3-4a1f-889a-de25e8fec466"
type = "MultipleChoice"
prompt.prompt = """
Эта программа не компилируется:

```java
void main() {
    IO.println(abs(-5));
}

int abs(int value) {
    if (value < 0) {
        return -value;
    }
}
```

Почему, если при вызове `abs(-5)` условие истинно и `return` точно выполнится?
"""
answer.answer = "Компилятор проверяет метод сам по себе, не заглядывая в вызовы: путь, где `value` неотрицательно, ничего не возвращает."
prompt.distractors = [
  "`-value` имеет тип, отличный от объявленного `int`.",
  "Метод `abs` уже есть в классе `Math`, и его нельзя переопределить.",
  "`return` нельзя использовать внутри `if`."
]
context = """
Сообщение: `missing return statement`. Компилятор анализирует каждый метод
отдельно и требует возврата по всем путям — независимо от того, какие аргументы
приходят на практике.

Это та же логика, что и с определённым присваиванием переменной: рассуждения
«на самом деле сюда никогда не попадём» компилятор не принимает.
"""

[[questions]]
id = "a0e11662-eedb-4625-b314-6ab31eaf1def"
type = "MultipleChoice"
prompt.prompt = """
Можно ли объявить в одном классе два метода с одинаковым именем и одинаковыми
параметрами, но разными типами возвращаемого значения?
"""
answer.answer = "Нет: по вызову невозможно понять, какой из них имелся в виду."
prompt.distractors = [
  "Да, это обычная перегрузка.",
  "Да, но только если один из них `static`.",
  "Да, компилятор выберет по типу переменной, куда записывают результат."
]
context = """
Перегрузка различает методы по параметрам. Тип результата в выборе не
участвует: вызов `max(3, 7)` сам по себе не говорит, какой из вариантов нужен,
а результат вызова вообще можно проигнорировать.
"""
