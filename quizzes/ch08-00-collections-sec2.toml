[[questions]]
id = "0fe6a293-8894-4077-bb78-809d6034c4b5"
type = "MultipleChoice"
prompt.prompt = """
Из списка `["а", "б", "в"]` удаляют элемент прямо в цикле `for`-по-элементам.
При удалении `"а"` программа падает с `ConcurrentModificationException`, а при
удалении `"б"` спокойно печатает `[а, в]`. Почему во втором случае исключения нет?
"""
answer.answer = "После удаления длина стала равна двум, обходчик как раз стоял на позиции два и решил, что элементы закончились, — до проверки дело не дошло."
prompt.distractors = [
  "Удаление предпоследнего элемента разрешено, остальных — нет.",
  "Проверка срабатывает только для первого элемента списка.",
  "Исключение есть, но `for`-по-элементам его проглатывает."
]
context = """
Проверка на изменение находится внутри перехода к следующему элементу. Здесь
перехода не случилось: обход завершился раньше.

Это худший вид ошибки — на одних данных код падает, на других тихо работает.
Тесты на трёх элементах проходят, а в бою всё разваливается. Правильный способ
удалить по условию — `removeIf`.
"""

[[questions]]
id = "ec7b55eb-5002-488c-9266-63dde3597ea0"
type = "MultipleChoice"
prompt.prompt = """
Объект с изменяемым полем положили в `HashSet`, затем изменили это поле. Теперь
`set.contains(объект)` возвращает `false`, хотя при печати множество содержит
именно его. Почему?
"""
answer.answer = "При добавлении объект лёг в ячейку по старому `hashCode()`, а поиск идёт по новому — в другую ячейку."
prompt.distractors = [
  "`contains` сравнивает через `==`, а объект после изменения стал другим.",
  "Множество хранит копию объекта, а не его самого.",
  "`hashCode()` кешируется при добавлении, поэтому сравнение всегда ложно."
]
context = """
`HashSet` вычисляет `hashCode()` один раз — при добавлении — и по нему выбирает
ячейку. Объект остался в старой ячейке, а поиск теперь заглядывает в новую.

Объект потерян: он в множестве, но недостижим. Отсюда правило: ключи словарей и
элементы множеств должны быть неизменяемыми. Лучший кандидат — запись из главы 7
или строка.
"""

[[questions]]
id = "4ba8d96c-4242-4654-ae57-7e3234df4566"
type = "ShortAnswer"
prompt.prompt = """
Каким методом списка безопасно удалить все элементы, подходящие под условие, не
рискуя `ConcurrentModificationException`? Напишите имя метода.
"""
answer.answer = "removeIf"
context = """
`items.removeIf(s -> s.equals("а"))` удаляет по условию изнутри коллекции,
поэтому конфликта с обходом не возникает.
"""
