[[questions]]
id = "e1ebfb11-c441-47aa-bb3d-dfc88da063bc"
type = "MultipleChoice"
prompt.prompt = """
`Shape` — запечатанный интерфейс, разрешающий ровно `Circle` и `Rect`. В
`switch` по `Shape` обе ветки есть, а `default` нет, и всё компилируется.
Что произойдёт, если добавить третью фигуру `Triangle`?
"""
answer.answer = "Программа перестанет компилироваться во всех таких `switch`, пока их не дополнят."
prompt.distractors = [
  "`switch` вернёт `null` для треугольника.",
  "Во время работы будет выброшено исключение при встрече с треугольником.",
  "Ничего: `switch` просто пропустит незнакомый вариант."
]
context = """
Ради этого запечатанные типы и существуют. Обычно добавление варианта — самая
опасная правка: где-то остаётся `if`, который про него не знает, и программа
тихо делает не то.

Здесь компилятор перечисляет **все** места, которые надо поправить. Это
принципиально надёжнее, чем искать их по проекту глазами.
"""

[[questions]]
id = "aa2f74bb-5345-4d46-a04c-6e241463aed4"
type = "Tracing"
prompt.program = """
sealed interface Shape permits Circle, Rect {}
record Circle(double radius) implements Shape {}
record Rect(double width, double height) implements Shape {}

String describe(Shape s) {
    return switch (s) {
        case Rect(double w, double h) when w == h -> "квадрат";
        case Rect(double w, double h) -> "прямоугольник";
        case Circle(double r) -> "круг";
    };
}

void main() {
    IO.println(describe(new Rect(2, 2)));
    IO.println(describe(new Rect(2, 3)));
}
"""
answer.doesCompile = true
answer.stdout = """
квадрат
прямоугольник
"""
context = """
Ветки проверяются сверху вниз. Квадрат подходит под обе ветки с `Rect`, но
первая стоит раньше и имеет страж `when w == h` — срабатывает она.

Поменяйте ветки местами, и программа не соберётся:
`this case label is dominated by a preceding case label` — общая ветка заберёт
все прямоугольники, и до частной ничего не дойдёт.
"""

[[questions]]
id = "209490cf-b227-4ead-a275-a727a2d0564e"
type = "MultipleChoice"
prompt.prompt = """
Операции над набором типов приходится добавлять часто, а сам набор типов
устоялся и почти не меняется. Что выбрать?
"""
answer.answer = "Запечатанный тип и `switch`: новая операция — это один метод, и компилятор проверит полноту."
prompt.distractors = [
  "Интерфейс и полиморфизм: операция добавляется одним методом в интерфейс.",
  "Абстрактный класс: общий код операций попадёт в родителя.",
  "Разницы нет, выбор чисто стилистический."
]
context = """
Два подхода решают одну задачу с разных сторон. При полиморфизме дёшево
добавлять **типы** (новый класс — и ничего не трогаем), но дорого операции:
метод придётся дописать в каждый класс. С запечатанным типом наоборот.

Здесь набор типов устоялся, а операции добавляются — значит, дорогая сторона
полиморфизма как раз и сработает. Эту дилемму называют проблемой выражения.
"""

[[questions]]
id = "45392a59-4c12-4f8b-99ce-de3110f6e570"
type = "ShortAnswer"
prompt.prompt = """
Каким ключевым словом к образцу в `case` добавляют дополнительное условие
(например, что ширина равна высоте)?
"""
answer.answer = "when"
context = """
`case Rect(double w, double h) when w == h -> ...` — такое условие называют
стражем. Ветка со стражем должна стоять раньше более общей: иначе общая её
перекроет, и компилятор это заметит.
"""
