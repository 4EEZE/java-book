[[questions]]
id = "c022d2f6-a6fe-440c-9e56-2cd2c9007407"
type = "Tracing"
prompt.program = """
import java.util.ArrayList;
import java.util.List;

void main() {
    List<Integer> numbers = new ArrayList<>(List.of(1, 2, 3));
    numbers.remove(1);
    IO.println(numbers);
}
"""
answer.doesCompile = true
answer.stdout = "[1, 3]"
context = """
У списка два метода удаления: `remove(int)` убирает по **индексу**,
`remove(Object)` — по **значению**. Вызов `remove(1)` подходит под первый, и
удаляется элемент с индексом 1, то есть двойка.

Чтобы удалить именно значение, его делают объектом явно:
`remove(Integer.valueOf(1))` — тогда получится `[2, 3]`.
"""

[[questions]]
id = "0fe6a293-8894-4077-bb78-809d6034c4b5"
type = "MultipleChoice"
prompt.prompt = """
Из списка `["а", "б", "в"]` удаляют элемент прямо в цикле `for`-по-элементам.
При удалении `"а"` программа падает с `ConcurrentModificationException`, а при
удалении `"б"` спокойно печатает `[а, в]`. Почему во втором случае исключения нет?
"""
answer.answer = "После удаления длина стала равна двум, обходчик как раз стоял на позиции два и решил, что элементы закончились, — до проверки дело не дошло."
prompt.distractors = [
  "Удаление предпоследнего элемента разрешено, остальных — нет.",
  "Проверка срабатывает только для первого элемента списка.",
  "Исключение есть, но `for`-по-элементам его проглатывает."
]
context = """
Проверка на изменение находится внутри перехода к следующему элементу. Здесь
перехода не случилось: обход завершился раньше.

Это худший вид ошибки — на одних данных код падает, на других тихо работает.
Тесты на трёх элементах проходят, а в бою всё разваливается. Правильный способ
удалить по условию — `removeIf`.
"""

[[questions]]
id = "07dc31ac-4b2a-4ed8-90d6-323e5a1451d1"
type = "Tracing"
prompt.program = """
import java.util.HashMap;
import java.util.Map;

void main() {
    String[] words = {"кот", "пёс", "кот"};
    Map<String, Integer> count = new HashMap<>();
    for (String word : words) {
        count.put(word, count.getOrDefault(word, 0) + 1);
    }
    IO.println(count.get("кот") + " " + count.get("пёс") + " " + count.get("ёж"));
}
"""
answer.doesCompile = true
answer.stdout = "2 1 null"
context = """
`getOrDefault(ключ, значение)` возвращает подстановку, когда ключа ещё нет, —
поэтому счётчик начинается с нуля без всяких проверок.

А вот обычный `get` для отсутствующего ключа возвращает `null`, что и видно в
третьем значении. Если бы этот `null` попал в арифметику, программа упала бы с
`NullPointerException`.

Печатать словарь целиком здесь было бы неправильно: `HashMap` не обещает
никакого порядка обхода.
"""

[[questions]]
id = "ec7b55eb-5002-488c-9266-63dde3597ea0"
type = "MultipleChoice"
prompt.prompt = """
Объект с изменяемым полем положили в `HashSet`, затем изменили это поле. Теперь
`set.contains(объект)` возвращает `false`, хотя при печати множество содержит
именно его. Почему?
"""
answer.answer = "При добавлении объект лёг в ячейку по старому `hashCode()`, а поиск идёт по новому — в другую ячейку."
prompt.distractors = [
  "`contains` сравнивает через `==`, а объект после изменения стал другим.",
  "Множество хранит копию объекта, а не его самого.",
  "`hashCode()` кешируется при добавлении, поэтому сравнение всегда ложно."
]
context = """
`HashSet` вычисляет `hashCode()` один раз — при добавлении — и по нему выбирает
ячейку. Объект остался в старой ячейке, а поиск теперь заглядывает в новую.

Объект потерян: он в множестве, но недостижим. Отсюда правило: ключи словарей и
элементы множеств должны быть неизменяемыми. Лучший кандидат — запись из главы 7
или строка.
"""

[[questions]]
id = "5b0cafbf-e6ec-48cc-abf7-a95f3a2cc3f7"
type = "MultipleChoice"
prompt.prompt = """
Почему принято писать `List<String> names = new ArrayList<>()`, а не
`ArrayList<String> names = new ArrayList<>()`?
"""
answer.answer = "Чтобы реализацию можно было поменять, не трогая остальной код: `List` говорит, что это список, не уточняя, какой именно."
prompt.distractors = [
  "`ArrayList` слева работает медленнее из-за приведения типов.",
  "Так требует компилятор: тип слева обязан быть интерфейсом.",
  "`List` слева позволяет положить в список элементы любых типов."
]
context = """
Это тот же принцип, что в главе 6: код зависит от того, что объект умеет, а не
от того, как он устроен. Особенно важно для параметров методов — метод,
принимающий `List`, примет любой список, а принимающий `ArrayList` — только его.
"""

[[questions]]
id = "4ba8d96c-4242-4654-ae57-7e3234df4566"
type = "ShortAnswer"
prompt.prompt = """
Каким методом списка безопасно удалить все элементы, подходящие под условие, не
рискуя `ConcurrentModificationException`? Напишите имя метода.
"""
answer.answer = "removeIf"
context = """
`items.removeIf(s -> s.equals("а"))` удаляет по условию изнутри коллекции,
поэтому конфликта с обходом не возникает.
"""
