[[questions]]
id = "f5382203-9e5a-4bb3-b0f9-98a4cb06d1e0"
type = "MultipleChoice"
prompt.prompt = """
Пятьдесят тысяч виртуальных потоков, каждый спит 100 мс, отрабатывают примерно
за 225 мс. Почему обычными потоками так не получится?
"""
answer.answer = "Обычный поток — это поток операционной системы со стеком около мегабайта; пятьдесят тысяч таких не поместятся в память."
prompt.distractors = [
  "Обычные потоки не умеют спать одновременно, они делают это по очереди.",
  "Обычные потоки ограничены числом ядер процессора.",
  "Обычные потоки работают, но переключение между ними заняло бы часы."
]
context = """
Стек обычного потока выделяется заранее и целиком. Виртуальный поток управляется
виртуальной машиной, его стек растёт по мере надобности и живёт в куче — стоит
он сотни байт вместо мегабайт.
"""

[[questions]]
id = "842b8b4b-4720-4104-b076-db5f75d73b6a"
type = "MultipleChoice"
prompt.prompt = """
Задача занимается тяжёлыми вычислениями и ничего не ждёт. Ускорят ли её
виртуальные потоки?
"""
answer.answer = "Нет: считающая задача занимает несущий платформенный поток целиком, а их по числу ядер."
prompt.distractors = [
  "Да, примерно во столько раз, сколько виртуальных потоков создано.",
  "Да, потому что переключение между виртуальными потоками дешевле.",
  "Нет, и более того — вычисления в них работают медленнее обычных потоков."
]
context = """
Виртуальный поток снимается с несущего только тогда, когда **ждёт**: сон, сеть,
файл, блокировка. Выигрыш появляется там, где потоки ждут, — в серверах и работе
с сетью, а не в счёте.
"""

[[questions]]
id = "7f4a9ce5-a59d-45b0-98f8-d68ee1504a5d"
type = "MultipleChoice"
prompt.prompt = """
Почему виртуальные потоки не складывают в пул фиксированного размера, как делали
с обычными?
"""
answer.answer = "Это уничтожает идею: снова ограничивается количество там, где ограничивать нечего."
prompt.distractors = [
  "Пул не умеет работать с виртуальными потоками — он их отвергает.",
  "Виртуальные потоки нельзя переиспользовать: после задачи они непригодны.",
  "Пул фиксированного размера превращает виртуальные потоки в обычные."
]
context = """
Пул обычных потоков существовал ради экономии дорогого ресурса. Виртуальный
поток дешёвый: его создают под задачу и он умирает вместе с ней.

`newVirtualThreadPerTaskExecutor` — не хранилище потоков, а способ дождаться
завершения всех задач.
"""

[[questions]]
id = "86059c40-4027-435d-96da-c0f33c59b195"
type = "MultipleChoice"
prompt.prompt = """
Что происходит с гонками и взаимными блокировками при переходе на виртуальные
потоки?
"""
answer.answer = "Всё остаётся в силе и становится вероятнее: одновременных потоков теперь не двести, а десятки тысяч."
prompt.distractors = [
  "Исчезают: виртуальные потоки выполняются по очереди на несущих потоках.",
  "Остаются, но только при использовании `synchronized`; атомарные типы теперь не нужны.",
  "Исчезают гонки, но взаимные блокировки остаются."
]
context = """
Виртуальные потоки решают задачу количества, и только её. `synchronized`,
`volatile` и атомарные типы нужны ровно так же.

Редкая гонка, которая прежде случалась раз в месяц, при пятидесяти тысячах
одновременных потоков случится сегодня.
"""

[[questions]]
id = "1427ac7c-a10f-4cf9-b160-931ff92f8182"
type = "MultipleChoice"
prompt.prompt = """
Главное удобство виртуальных потоков для кода, который много ждёт, — это…
"""
answer.answer = "возможность писать обычный блокирующий код без обратных вызовов, сохраняя внятную трассировку и привычный `try`/`catch`."
prompt.distractors = [
  "автоматическое распараллеливание циклов внутри задачи.",
  "отсутствие необходимости обрабатывать исключения в задачах.",
  "возможность обращаться к общим данным без синхронизации."
]
context = """
Асинхронные схемы решали ту же задачу пропускной способности, но ценой кода:
цепочки обратных вызовов, потерянная трассировка, тяжёлая отладка.

С виртуальными потоками блокирующий вызов — это нормально, и то, ради чего
городили асинхронность, получается само.
"""

[[questions]]
id = "fdea98ba-9eeb-41e9-8018-9c0d4c31104b"
type = "MultipleChoice"
prompt.prompt = """
Чем `StructuredTaskScope` отличается от виртуальных потоков по готовности к
применению?
"""
answer.answer = "Это всё ещё предварительная возможность: нужен флаг `--enable-preview`, и её вид менялся от выпуска к выпуску."
prompt.distractors = [
  "Ничем: обе появились в Java 21 в окончательном виде.",
  "Она доступна только в коммерческих сборках JDK.",
  "Она готова, но работает исключительно с обычными потоками."
]
context = """
Без флага получите `StructuredTaskScope is a preview API and is disabled by
default`.

Примеры из статей двухлетней давности уже не соберутся. Сверяйтесь с
документацией своей версии, а в рабочий код берите, понимая, что при обновлении
Java его придётся править.
"""
