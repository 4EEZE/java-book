[[questions]]
id = "1967c4cf-4405-46a8-a6e4-9b67fe76ca20"
type = "MultipleChoice"
prompt.prompt = """
Переменная объявлена как `List<Integer>`, а метод принимает `List<Number>`.
Компилятор отказывается: `required: List<Number>, found: List<Integer>`. Зачем
такой запрет, если каждое `Integer` является `Number`?
"""
answer.answer = "Иначе через `List<Number>` в список целых можно было бы положить дробное число, и обещание объявленного типа нарушилось бы."
prompt.distractors = [
  "Из-за стирания типов компилятор не знает, что `Integer` наследует `Number`.",
  "Запрет чисто исторический и снят, если включить подстановочные типы.",
  "`List<Number>` требует ровно `Number`, потому что интерфейс `List` инвариантен по реализации."
]
context = """
Разрешив присваивание, мы получили бы список, объявленный как список целых, но
содержащий дробное — и падение при чтении. Компилятор запрещает присваивание,
чтобы не допустить порчу.

Это свойство называют инвариантностью. Если метод только читает, ограничение
снимается подстановкой: `List<? extends Number>`.
"""

[[questions]]
id = "699bf95c-9e87-433a-b4ef-8f3f93baedfa"
type = "MultipleChoice"
prompt.prompt = """
Для массивов присваивание `Object[] objects = strings;` (где `strings` — это
`String[]`) разрешено. Чем это плохо?
"""
answer.answer = "Запись `objects[0] = 42` скомпилируется, а упадёт `ArrayStoreException` во время работы программы."
prompt.distractors = [
  "Ничем: массивы проверяют тип при компиляции надёжнее обобщённых типов.",
  "Массив после такого присваивания становится неизменяемым.",
  "Элементы массива молча приводятся к `Object` и теряют исходный тип."
]
context = """
Массивы в Java **ковариантны**: `String[]` считается разновидностью `Object[]`.
Это признанная ошибка проектирования, оставшаяся с первой версии языка, и
обобщённые типы её сознательно не повторили.

Сравните: с обобщёнными типами такая ошибка обнаруживается при компиляции и
программа не собирается, а с массивами — у пользователя.
"""

[[questions]]
id = "d986057c-1fe8-4a95-a35a-29796e11c2cd"
type = "MultipleChoice"
prompt.prompt = """
Метод только перебирает элементы коллекции и ничего в неё не добавляет. Какую
подстановку выбрать для параметра?
"""
answer.answer = "`List<? extends T>` — из такой коллекции можно читать, но нельзя добавлять."
prompt.distractors = [
  "`List<? super T>` — она принимает больше разных списков.",
  "`List<?>` — без ограничений, раз тип элементов не важен.",
  "Просто `List<T>` — подстановки нужны только при записи."
]
context = """
Правило называется PECS — *producer extends, consumer super*: из чего читаем —
`? extends`, во что записываем — `? super`, делаем и то и другое — просто `T`.

Добавлять в `? extends T` запрещено не из вредности: под ним может скрываться
`List<Double>`, и целое число туда класть нельзя. Раз безопасное добавление
невозможно, запрещено любое.
"""
