[[questions]]
id = "ad07e703-c33c-4b53-9249-b2f4e6709147"
type = "Tracing"
prompt.program = """
void main() {
    int[] first = {1, 2, 3};
    int[] second = first;
    second[0] = 99;
    IO.println(first[0]);
}
"""
answer.doesCompile = true
answer.stdout = "99"
context = """
Присваивание скопировало **ссылку**, а не массив. Обе переменные указывают на
один и тот же объект в куче, поэтому изменение через любую из них видно через
обе.
"""

[[questions]]
id = "59179590-0241-4a9c-a0f1-ff41c8dba5f3"
type = "Tracing"
prompt.program = """
void main() {
    int[] first = {1, 2, 3};
    int[] second = {1, 2, 3};
    IO.println(first == second);
}
"""
answer.doesCompile = true
answer.stdout = "false"
context = """
Здесь созданы два разных массива. `==` для ссылочных типов отвечает на вопрос
«это один и тот же объект?», а не «одинаковое ли содержимое?». Объекты разные,
поэтому `false`.

Сравнить содержимое массивов можно через `java.util.Arrays.equals`.
"""

[[questions]]
id = "093d8e31-cb7b-44b6-a821-80f6c7527d22"
type = "Tracing"
prompt.program = """
void main() {
    String a = "привет";
    String b = "привет";
    String c = new String("привет");
    IO.println(a == b);
    IO.println(a == c);
}
"""
answer.doesCompile = true
answer.stdout = """
true
false
"""
context = """
Одинаковые строковые литералы виртуальная машина держит в пуле и переиспользует
— поэтому `a` и `b` оказались одним объектом. `new String(...)` создаёт новый
объект мимо пула, поэтому `a == c` даёт `false`.

Именно поэтому строки никогда не сравнивают через `==`: сравнение может
случайно сработать на литералах и сломаться на строке, прочитанной из файла.
"""

[[questions]]
id = "e1f4f03d-3fda-4942-b22b-7e896b282e5a"
type = "MultipleChoice"
prompt.prompt = """
Где физически находится объект, созданный через `new`, и что при этом лежит в
локальной переменной?
"""
answer.answer = "Объект — в куче, в переменной (в стеке) — ссылка на него."
prompt.distractors = [
  "И объект, и переменная — в стеке.",
  "И объект, и переменная — в куче.",
  "Объект — в стеке, а в куче — ссылка на него."
]
context = """
Стек — память вызовов методов: там лежат параметры и локальные переменные, и он
освобождается мгновенно при выходе из метода. Куча — память объектов, её
освобождает сборщик мусора.

У каждого потока свой стек, а куча одна на всех — отсюда все сложности главы 18.
"""
