[[questions]]
id = "7e85110f-6dc4-4118-a778-093050c5129e"
type = "Tracing"
prompt.program = """
import java.util.List;

void main() {
    List<String> names = List.of("Аня", "Борис", "Вера");
    names.stream().filter(n -> n.length() > 3).map(String::toUpperCase);
    IO.println("готово");
}
"""
answer.doesCompile = true
answer.stdout = "готово"
context = """
Цепочка не выполнила **ничего**: ни одно имя не проверено, ни одно не приведено
к верхнему регистру. Промежуточные операции ленивы — они лишь запоминают, что
надо сделать.

Работа начинается только с терминальной операции: `toList`, `count`, `forEach`
и подобных. Без неё поток бесполезен.
"""

[[questions]]
id = "6ec66648-cc4f-4e45-9856-2c53c45a878f"
type = "MultipleChoice"
prompt.prompt = """
Почему второй вызов `stream.count()` на том же объекте потока выбрасывает
`IllegalStateException`?
"""
answer.answer = "Поток — не коллекция, а описание обработки, и выполняется оно один раз."
prompt.distractors = [
  "Первый `count()` удалил элементы из источника.",
  "`count()` можно вызывать только после терминальной операции.",
  "Поток закрылся из-за нехватки памяти на повторный обход."
]
context = """
Сообщение: `stream has already been operated upon or closed`. Нужен второй
проход — создавайте поток заново от источника.

Отсюда практическое следствие: поток не хранят в поле и не передают далеко. Его
создают и тут же используют.
"""

[[questions]]
id = "35e740ce-82eb-4891-95cd-a05f02a42c74"
type = "Tracing"
prompt.program = """
import java.util.List;
import java.util.Optional;

void main() {
    List<Integer> years = List.of(1869, 1872);

    Optional<Integer> found = years.stream().filter(y -> y > 1900).findFirst();
    IO.println(found.map(String::valueOf).orElse("не нашли"));

    Optional<Integer> old = years.stream().filter(y -> y < 1900).findFirst();
    IO.println(old.map(String::valueOf).orElse("не нашли"));
}
"""
answer.doesCompile = true
answer.stdout = """
не нашли
1869
"""
context = """
`map` применяет функцию, если значение есть, и ничего не делает, если его нет.
`orElse` подставляет запасное. Ни одной проверки `if` не понадобилось.

`findFirst` возвращает `Optional`, а не значение, — так возможное отсутствие
сообщается **типом**, и не заметить его невозможно.
"""

[[questions]]
id = "298b48a1-1355-4796-8929-fd492a7eb43e"
type = "MultipleChoice"
prompt.prompt = """
Чем плоха связка «проверить через `isPresent()`, затем достать через `get()`»?
"""
answer.answer = "Это переписанная проверка на `null`, только длиннее: вся польза `Optional` теряется."
prompt.distractors = [
  "Она работает медленнее, чем `orElse`.",
  "`isPresent()` возвращает `true` и для пустого `Optional`.",
  "Ничем: это рекомендуемый способ обращения с `Optional`."
]
context = """
Смысл `Optional` в том, чтобы обходиться без явной проверки: `map`, `filter`,
`orElse`, `ifPresent` делают это за вас.

Сам `get()` на пустом значении бросает `NoSuchElementException` — то есть
возвращает вас ровно туда, откуда уходили, только исключение теперь другое. Если
проверка нужна явно, есть `orElseThrow`: он хотя бы честно называет намерение.
"""

[[questions]]
id = "c4e39410-2027-4c08-84e2-6cf82c0f882f"
type = "MultipleChoice"
prompt.prompt = """
В чём разница между `orElse(запасное)` и `orElseGet(() -> запасное)`?
"""
answer.answer = "`orElse` вычисляет запасное значение всегда, даже когда оно не понадобится; `orElseGet` — только при отсутствии."
prompt.distractors = [
  "`orElse` работает только с примитивами, `orElseGet` — с объектами.",
  "`orElseGet` бросает исключение, если значение отсутствует.",
  "Разницы нет, `orElseGet` оставлен для совместимости."
]
context = """
Разница незаметна, пока запасное значение дёшево получить. Если же за ним идут в
базу или считают его долго, `orElse` сделает эту работу впустую при каждом
вызове — включая те, где значение есть.
"""

[[questions]]
id = "67683933-09a5-44c4-9022-726f0df8cf68"
type = "MultipleChoice"
prompt.prompt = """
Где `Optional` использовать **не** стоит?
"""
answer.answer = "В полях класса и в параметрах методов — он задуман как тип возвращаемого значения."
prompt.distractors = [
  "В цепочках потоков — там он только мешает выводу типов.",
  "В методах, которые могут ничего не найти, — там достаточно вернуть `null`.",
  "В публичных методах библиотек — он усложняет их использование."
]
context = """
Полем `Optional` быть не предназначен и не сериализуется. Параметром — заставит
вызывающего оборачивать значение, которое у него и так есть; лучше две
перегрузки. И не нужен для коллекций: пустой список уже означает «ничего нет».

Коротко: `Optional` возвращают, а не хранят и не принимают.
"""
