[[questions]]
id = "02099d93-5ae7-468a-9e73-2b61a693d21a"
type = "MultipleChoice"
prompt.prompt = """
Когда объект в Java становится мусором и может быть удалён?
"""
answer.answer = "Когда до него больше нельзя добраться ни по одной ссылке."
prompt.distractors = [
  "Когда выполнение вышло из метода, где он был создан.",
  "Когда переменной, хранившей его, присвоили `null`.",
  "Когда программа вызвала `System.gc()`."
]
context = """
Критерий — недостижимость. Присваивание `null` одной переменной помогает только
если других ссылок не осталось, а `System.gc()` — не команда, а пожелание,
которое JVM вправе проигнорировать.

Момент фактического удаления не определён: объект исчезнет, когда сборщик до
него дойдёт.
"""

[[questions]]
id = "325d1546-5de8-4720-8fc7-903c904e7de0"
type = "MultipleChoice"
prompt.prompt = """
Что из перечисленного сборщик мусора **не** освобождает автоматически?
"""
answer.answer = "Открытые файлы и сетевые соединения."
prompt.distractors = [
  "Объекты, созданные через `new`.",
  "Массивы, на которые не осталось ссылок.",
  "Строки, собранные во время работы программы."
]
context = """
Сборщик освобождает память — и только её. Дескрипторы файлов и сокеты
ограничены операционной системой, и ждать сборки нельзя: их закрывают явно,
через `try` с ресурсами.
"""

[[questions]]
id = "cd418287-c04e-4a41-b170-6fc5fe23d196"
type = "Tracing"
prompt.program = """
void main() {
    try (var first = new Resource("первый");
         var second = new Resource("второй")) {
        IO.println("работаем");
    }
}

class Resource implements AutoCloseable {
    private final String name;

    Resource(String name) {
        this.name = name;
        IO.println("открыт: " + name);
    }

    public void close() {
        IO.println("закрыт: " + name);
    }
}
"""
answer.doesCompile = true
answer.stdout = """
открыт: первый
открыт: второй
работаем
закрыт: второй
закрыт: первый
"""
context = """
Ресурсы закрываются в порядке, обратном открытию: второй открыт последним и
закрыт первым. Это существенно, когда один ресурс зависит от другого.

Закрытие происходит при любом выходе из блока, включая аварийный, — и до блока
`catch`, если он есть.
"""

[[questions]]
id = "3cd6f7d8-4a62-4e28-be4c-beb971e54fb8"
type = "ShortAnswer"
prompt.prompt = """
Какой интерфейс должен реализовать класс, чтобы его объект можно было
использовать в `try` с ресурсами? Напишите имя интерфейса.
"""
answer.answer = "AutoCloseable"
answer.alternatives = ["java.lang.AutoCloseable", "Closeable"]
context = """
`AutoCloseable` требует единственный метод `close()`. Все классы стандартной
библиотеки, связанные с файлами и сетью, его реализуют.

Устаревший `finalize()` для этого не годится: момент его вызова не гарантирован,
а сам метод удаляется из языка.
"""
