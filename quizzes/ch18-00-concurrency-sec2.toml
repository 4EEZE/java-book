[[questions]]
id = "e8f2b55e-2a5a-4d4d-831b-f093514c7f94"
type = "MultipleChoice"
prompt.prompt = """
Какой подход к совместному доступу самый надёжный?
"""
answer.answer = "Не делить изменяемое состояние вовсе: неизменяемые объекты безопасны по построению."
prompt.distractors = [
  "Помечать все общие поля `volatile` — это дёшево и покрывает все случаи.",
  "Синхронизировать каждый метод, работающий с общими данными.",
  "Использовать только потокобезопасные коллекции вместо обычных."
]
context = """
То, что нельзя изменить, нельзя и испортить гонкой. Задача, которая принимает
данные и возвращает результат, ничего не меняя вокруг, не нуждается ни в
`synchronized`, ни в `volatile`.

Это не решение проблемы совместного доступа, а устранение самого совместного
доступа — потому и надёжнее прочих.
"""

[[questions]]
id = "5032a6fd-b3ab-4ac2-b8b5-e3225a0eadc0"
type = "MultipleChoice"
prompt.prompt = """
`ConcurrentHashMap` потокобезопасен. Значит ли это, что связка «проверить
наличие ключа, затем положить значение» тоже безопасна?
"""
answer.answer = "Нет: безопасны отдельные операции, а две подряд — уже нет; для этого есть `putIfAbsent` и `computeIfAbsent`."
prompt.distractors = [
  "Да: все обращения к `ConcurrentHashMap` выполняются под общей блокировкой.",
  "Да, если обе операции идут подряд без других вызовов между ними.",
  "Нет, и помочь тут может только `synchronized` вокруг обеих операций."
]
context = """
Между проверкой и записью другой поток успеет вклиниться. `putIfAbsent` и
`computeIfAbsent` делают оба шага разом — потому и существуют.

Это тот же приём, что с файлами в главе 16: там, где состояние может измениться
между проверкой и действием, нужна одна неделимая операция.
"""
