[[questions]]
id = "5239f8a7-1473-41de-b303-9f6c08a036cd"
type = "MultipleChoice"
prompt.prompt = """
Тест упал, и JUnit написал `expected: <9,99> but was: <3,00>`. Что должно быть
у класса `Money`, чтобы сообщение выглядело так, а не как
`expected: <Money@6591f517> but was: <Money@70beb599>`?
"""
answer.answer = "Осмысленный `toString`."
prompt.distractors = [
  "Осмысленный `hashCode`.",
  "Аннотация `@DisplayName` на тесте.",
  "Реализация интерфейса `Comparable`."
]
context = """
`assertEquals` печатает значения через `toString`. Именно здесь он и окупается:
в обычной работе программы его почти не читают, зато читают каждый раз, когда
что-то сломалось.

`equals` тоже необходим — без него `assertEquals` падал бы всегда, — но на вид
сообщения он не влияет.
"""

[[questions]]
id = "f65e4b77-1e87-4b1d-a512-ebf479e8a3ef"
type = "MultipleChoice"
prompt.prompt = """
Метод помечен `@BeforeEach`. Сколько раз он выполнится, если в классе четыре
теста?
"""
answer.answer = "Четыре раза — перед каждым тестом."
prompt.distractors = [
  "Один раз — перед первым тестом.",
  "Один раз — перед всем классом, как статический блок.",
  "Столько раз, сколько тестов обратятся к подготовленным им полям."
]
context = """
Каждый тест получает свежее состояние и не зависит от того, что натворили
предыдущие. Это не мелочь: тест, который проходит только после другого теста, —
ловушка. Однажды порядок изменится, и вы получите загадочное падение.
"""

[[questions]]
id = "e7755b96-aff8-4938-b81f-6b85b289372e"
type = "MultipleChoice"
prompt.prompt = """
Почему тест, проверяющий, что внутри метода вызвался определённый другой метод в
определённом порядке, считается плохим?
"""
answer.answer = "Он сломается при первом же рефакторинге, хотя программа осталась правильной: он проверяет устройство, а не поведение."
prompt.distractors = [
  "Он работает медленнее, чем проверка возвращаемого значения.",
  "Такие проверки невозможно написать средствами JUnit.",
  "Он не учитывается при подсчёте покрытия тестами."
]
context = """
Тест на поведение — «метод возвращает правильную сумму» — переживёт
переписывание метода. Тест на устройство мешает менять код, не ловя при этом
ошибок, и потому хуже, чем его отсутствие.

Отсюда и отношение к покрытию: процент — не цель.
"""

[[questions]]
id = "bb34c751-5753-4748-9651-f69ebf9fc437"
type = "ShortAnswer"
prompt.prompt = """
Каким утверждением JUnit проверяют, что код выбрасывает исключение нужного типа?
Напишите имя метода.
"""
answer.answer = "assertThrows"
context = """
`assertThrows(IllegalArgumentException.class, () -> new Money(-1))` запускает
код, убеждается, что вылетело исключение указанного типа, и возвращает его —
чтобы можно было проверить ещё и сообщение.
"""

[[questions]]
id = "e96a0858-32c4-431a-a111-21b1b66e46db"
type = "Tracing"
prompt.program = """
record Money(long kopecks) {
    Money plus(Money other) { return new Money(kopecks + other.kopecks); }
}

void main() {
    IO.println(new Money(100).plus(new Money(200)).equals(new Money(300)));
}
"""
answer.doesCompile = true
answer.stdout = "true"
context = """
Именно на этом держится `assertEquals`: внутри он вызывает `equals`. Запись
получает его готовым и сравнивающим по всем полям.

Будь `Money` обычным классом без `equals` из главы 11, здесь было бы `false` —
и тест падал бы всегда, сколько бы копеек мы ни считали.
"""

[[questions]]
id = "cdd802db-293f-4636-9312-1b3b6cd15da3"
type = "MultipleChoice"
prompt.prompt = """
Что из перечисленного писать тестами обычно **не** стоит?
"""
answer.answer = "Геттеры без логики и чужие библиотеки."
prompt.distractors = [
  "Граничные случаи: ноль, пустую коллекцию, максимальное значение.",
  "Каждую найденную в программе ошибку.",
  "Логику с ветвлениями и вычислениями."
]
context = """
Геттер без логики сломаться не может, а чужая библиотека — не ваша
ответственность.

Тест по следам найденной ошибки, наоборот, один из самых ценных: он
гарантирует, что она не вернётся.
"""
