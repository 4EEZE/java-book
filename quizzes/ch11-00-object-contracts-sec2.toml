[[questions]]
id = "c476a775-2216-4ef3-a1d4-56765fad8755"
type = "Tracing"
prompt.program = """
class Point {
    final int x, y;
    Point(int x, int y) { this.x = x; this.y = y; }

    @Override public boolean equals(Object o) {
        return o instanceof Point p && p.x == x && p.y == y;
    }
}

class ColoredPoint extends Point {
    final String color;
    ColoredPoint(int x, int y, String c) { super(x, y); color = c; }

    @Override public boolean equals(Object o) {
        return o instanceof ColoredPoint p && p.x == x && p.y == y
            && p.color.equals(color);
    }
}

void main() {
    Point p = new Point(1, 2);
    ColoredPoint cp = new ColoredPoint(1, 2, "красный");
    IO.println(p.equals(cp));
    IO.println(cp.equals(p));
}
"""
answer.doesCompile = true
answer.stdout = """
true
false
"""
context = """
Нарушена **симметричность**: `Point` видит в цветной точке обычную и
соглашается, а `ColoredPoint` требует совпадения цвета и отказывается.

Последствия хуже странного вывода: найдёт ли коллекция элемент, будет зависеть
от того, что ищут и что лежит внутри, — то есть от порядка сравнения, который
вы не контролируете.

Общего решения нет. Либо сравнивать классы точно через `getClass()`, либо —
обычно правильнее — не наследовать классы с `equals`, а использовать композицию.
"""

[[questions]]
id = "d4c21dbf-f9ae-4be3-becc-4962695e6671"
type = "MultipleChoice"
prompt.prompt = """
Зачем внутри своего `equals` сравнивать поля ссылочного типа через
`Objects.equals(a, b)`, а не через `a.equals(b)`?
"""
answer.answer = "Поле может быть `null`, и прямой вызов дал бы `NullPointerException`."
prompt.distractors = [
  "`Objects.equals` работает быстрее за счёт кеширования.",
  "`a.equals(b)` сравнивает ссылки, а `Objects.equals` — содержимое.",
  "Так требует контракт `equals`, иначе нарушается транзитивность."
]
context = """
`Objects.equals(x, y)` сначала сравнивает ссылки, потом проверяет `null`, и
только потом вызывает `equals`. Два `null` считаются равными, `null` и
значение — нет.
"""

[[questions]]
id = "ce5ee301-849b-42af-a55b-057e79e3f70d"
type = "MultipleChoice"
prompt.prompt = """
Почему для типа, который просто описывает данные, эти три метода советуют не
писать руками, а взять `record`?
"""
answer.answer = "Запись получает их сразу согласованными по всем полям, и нельзя ни забыть `hashCode`, ни разойтись в наборе полей, ни сломать симметричность."
prompt.distractors = [
  "Запись работает быстрее обычного класса за счёт особой реализации хеша.",
  "В записи `equals` сравнивает ссылки, что надёжнее сравнения по полям.",
  "У записи эти методы можно переопределить, а у класса нельзя."
]
context = """
Симметричность у записи не сломать по отдельной причине: записи нельзя
наследовать, а именно наследование её и ломает.

Руками эти методы имеет смысл писать только в классах с поведением и изменяемым
состоянием, где запись не подходит.
"""
