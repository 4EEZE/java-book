[[questions]]
id = "a93b5578-3886-4bd4-8765-901ce43df4e0"
type = "Tracing"
prompt.program = """
void main() {
    int day = 6;
    switch (day) {
        case 6:
            IO.println("суббота");
        case 7:
            IO.println("воскресенье");
        default:
            IO.println("рабочий день");
    }
}
"""
answer.doesCompile = true
answer.stdout = """
суббота
воскресенье
рабочий день
"""
context = """
Это **проваливание**: выполнив подходящую ветку, старая форма `switch`
продолжает выполнять все следующие, пока не встретит `break`. Поведение
унаследовано из C.

Новая форма со стрелкой `case 6 -> ...` от этого избавлена: выполняется ровно
одна ветка.
"""

[[questions]]
id = "8a37a619-c647-43f8-9ebf-fef200ec955a"
type = "MultipleChoice"
prompt.prompt = """
Эта программа не компилируется:

```java
void main() {
    int day = 6;
    String name = switch (day) {
        case 6 -> "суббота";
    };
    IO.println(name);
}
```

Что не так, и что изменится, если переписать её на старую форму `switch` с
`case 6:` и присваиванием внутри?
"""
answer.answer = "`switch`-выражение проверяется на полноту и требует `default`; старая форма собралась бы, но оставила бы `name` без значения."
prompt.distractors = [
  "Ветке `case` нужен `break`; на старой форме ошибка была бы та же.",
  "`switch` не умеет возвращать строки; старая форма работает с любыми типами.",
  "Переменную `day` нужно объявить `final`; на старой форме это тоже обязательно."
]
context = """
Сообщение: `the switch expression does not cover all possible input values`.
`switch` в форме выражения обязан дать значение при любом входе, поэтому нужна
ветка `default` либо покрытие всех вариантов.

Сравнение со старой формой здесь и есть суть: она в такой ситуации молчала.
Программа собиралась, а `name` тихо оставалась неинициализированной — ошибку
находил уже пользователь. Проверка полноты переносит её на этап компиляции.
"""

[[questions]]
id = "23c84042-e9cd-4692-aee9-4e02948920ea"
type = "Tracing"
prompt.program = """
void main() {
    int temperature = 5;
    if (temperature > 25)
        IO.println("жарко");
        IO.println("надеть шорты");
}
"""
answer.doesCompile = true
answer.stdout = "надеть шорты"
context = """
Без фигурных скобок в `if` попадает только **одна** следующая инструкция.
Вторая строка к условию не относится и выполняется всегда, хотя отступ говорит
об обратном.

Отсюда простое правило: скобки ставить всегда, даже для одной строки.
"""

[[questions]]
id = "0679e56a-f277-4885-91cd-6d06e293258f"
type = "Tracing"
prompt.program = """
void main() {
    for (int i = 1; i <= 6; i++) {
        if (i % 2 == 0) {
            continue;
        }
        if (i > 4) {
            break;
        }
        IO.println(i);
    }
}
"""
answer.doesCompile = true
answer.stdout = """
1
3
"""
context = """
Чётные значения пропускаются через `continue`. На `i = 5` первое условие ложно,
а второе истинно — срабатывает `break` и цикл прерывается, поэтому пятёрка не
печатается.
"""

[[questions]]
id = "ebf2719d-ab36-410c-84c1-877e6c10b2ec"
type = "ShortAnswer"
prompt.prompt = """
Каким ключевым словом ветка `switch`-выражения возвращает значение, если она
записана в фигурных скобках и состоит из нескольких инструкций?
"""
answer.answer = "yield"
context = """
Однострочная ветка со стрелкой возвращает значение выражения сама. Если ветке
нужно несколько инструкций, она берётся в фигурные скобки, и результат
отдаётся через `yield`.
"""
