[[questions]]
id = "7e85110f-6dc4-4118-a778-093050c5129e"
type = "Tracing"
prompt.program = """
import java.util.List;

void main() {
    List<String> names = List.of("Аня", "Борис", "Вера");
    names.stream().filter(n -> n.length() > 3).map(String::toUpperCase);
    IO.println("готово");
}
"""
answer.doesCompile = true
answer.stdout = "готово"
context = """
Цепочка не выполнила **ничего**: ни одно имя не проверено, ни одно не приведено
к верхнему регистру. Промежуточные операции ленивы — они лишь запоминают, что
надо сделать.

Работа начинается только с терминальной операции: `toList`, `count`, `forEach`
и подобных. Без неё поток бесполезен.
"""

[[questions]]
id = "6ec66648-cc4f-4e45-9856-2c53c45a878f"
type = "MultipleChoice"
prompt.prompt = """
Почему второй вызов `stream.count()` на том же объекте потока выбрасывает
`IllegalStateException`?
"""
answer.answer = "Поток — не коллекция, а описание обработки, и выполняется оно один раз."
prompt.distractors = [
  "Первый `count()` удалил элементы из источника.",
  "`count()` можно вызывать только после терминальной операции.",
  "Поток закрылся из-за нехватки памяти на повторный обход."
]
context = """
Сообщение: `stream has already been operated upon or closed`. Нужен второй
проход — создавайте поток заново от источника.

Отсюда практическое следствие: поток не хранят в поле и не передают далеко. Его
создают и тут же используют.
"""
