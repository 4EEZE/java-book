[[questions]]
id = "f38c4587-8aef-4aaf-ba4c-e60bdfdf422a"
type = "MultipleChoice"
prompt.prompt = """
Эта программа записана одним компактным файлом и печатает `100`, хотя поле
помечено `private`:

```java
class Account {
    private int balance = 100;
}

void main() {
    IO.println(new Account().balance);
}
```

Почему `private` не сработал?
"""
answer.answer = "В компактном файле `Account` становится вложенным классом, а внутри одного класса верхнего уровня `private` доступ не ограничивает."
prompt.distractors = [
  "`private` не действует на поля с начальным значением.",
  "`private` ограничивает доступ только из других пакетов.",
  "Поле прочитано сразу после `new`, до того как ограничение вступает в силу."
]
context = """
Компактный файл — это один класс, который компилятор достраивает сам, и всё
объявленное в нём попадает внутрь этого класса. `private` ограничивает доступ
границей класса **верхнего уровня**, а оба оказались внутри одной границы.

Разнесите те же два класса по файлам — и получите
`error: balance has private access in Account`. Именно поэтому с главы 5 книга
переходит на обычные файлы: на компактных разговор об инкапсуляции был бы
враньём.
"""

[[questions]]
id = "ab7f09d2-c58e-4dd9-b970-96c22af3368b"
type = "Tracing"
prompt.program = """
class Point {
    int x;
    String label;
    boolean visible;
}

void main() {
    Point p = new Point();
    IO.println(p.x + " / " + p.label + " / " + p.visible);
}
"""
answer.doesCompile = true
answer.stdout = "0 / null / false"
context = """
Поля, в отличие от локальных переменных, инициализировать не обязательно:
числовые получают ноль, логические — `false`, ссылочные — `null`.

Удобство с подвохом: поле типа `String`, которое забыли заполнить, равно `null`,
и `NullPointerException` случится далеко от места, где его забыли заполнить.
"""

[[questions]]
id = "f80c0d8c-4ff8-4214-8205-103f5fbde1c8"
type = "MultipleChoice"
prompt.prompt = """
У класса `Book` объявлен конструктор `Book(String title, String author, int year)`.
Строка `new Book()` перестала компилироваться, хотя раньше работала. Почему?
"""
answer.answer = "Бесплатный конструктор без аргументов существует, только пока у класса нет ни одного своего."
prompt.distractors = [
  "Конструктор без аргументов нужно объявлять явно в каждом классе.",
  "Конструктор с аргументами должен быть последним в файле.",
  "Класс стал `public`, а такие классы нельзя создавать без аргументов."
]
context = """
Сообщение: `constructor Book in class Book cannot be applied to given types;
required: String,String,int`.

Логика в том, что если вы описали, как правильно создавать объект, то создавать
его мимо этого описания, скорее всего, не нужно. Если конструктор без аргументов
всё-таки нужен, его добавляют рядом явно.
"""

[[questions]]
id = "6d797769-4165-4594-b4aa-1fb920d2b7b0"
type = "Tracing"
prompt.program = """
class Counter {
    static int created = 0;
    int id;

    Counter() {
        created++;
        id = created;
    }
}

void main() {
    new Counter();
    new Counter();
    Counter third = new Counter();
    IO.println(third.id + " из " + Counter.created);
}
"""
answer.doesCompile = true
answer.stdout = "3 из 3"
context = """
`id` своё у каждого объекта, `created` одно на весь класс. Третий объект получил
`id` равный трём, и всего создано три штуки.

Обратите внимание на обращение `Counter.created` — у класса, а не у объекта:
статическому полю объект не нужен.
"""

[[questions]]
id = "6a9f7ad3-75eb-4d10-8a3b-d21228791f81"
type = "MultipleChoice"
prompt.prompt = """
В конструкторе написали `title = title;` вместо `this.title = title;`, где
`title` — и имя поля, и имя параметра. Что произойдёт?
"""
answer.answer = "Программа скомпилируется и заработает, но поле останется пустым: параметр присвоен сам себе."
prompt.distractors = [
  "Ошибка компиляции: неоднозначное имя `title`.",
  "Поле будет заполнено правильно: компилятор понимает, что слева поле.",
  "Ошибка компиляции: присваивание переменной самой себе запрещено."
]
context = """
Внутри конструктора имя `title` означает ближайшее — параметр. Значит,
`title = title` присваивает параметру его же значение, а поле остаётся со
значением по умолчанию: `null` для строки.

Компилятор на это не жалуется — операция совершенно законная. Ради таких
случаев и существует `this`: он позволяет назвать именно поле.
"""
