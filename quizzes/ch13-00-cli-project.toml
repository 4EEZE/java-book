[[questions]]
id = "6b6d1848-50ac-43c2-af90-0d67e0c32aa3"
type = "Tracing"
prompt.program = """
void main(String[] args) {
    IO.println(args.length);
}
"""
answer.doesCompile = true
answer.stdout = "0"
context = """
В `args` попадает всё, что написано **после** имени программы. Имени самой
программы там нет — в отличие от C, где нулевой элемент это она.

Запущенная без аргументов, программа получает пустой массив, а не `null`.
"""

[[questions]]
id = "5fd731c5-c036-40aa-82d5-cb15eed60aa8"
type = "MultipleChoice"
prompt.prompt = """
Почему после `System.exit(1)` в блоке `catch` всё равно пишут `return`, хотя
программа уже завершается?
"""
answer.answer = "Компилятор про `System.exit` не знает и считает, что переменная ниже может остаться без значения."
prompt.distractors = [
  "Без `return` код возврата будет нулевым.",
  "`System.exit` только помечает программу на завершение, а прерывает её `return`.",
  "Так требует синтаксис: `catch` обязан заканчиваться `return` или `throw`."
]
context = """
Это определённое присваивание из главы 3: компилятор требует, чтобы значение
было присвоено по всем путям, и рассуждения «сюда мы не дойдём» не принимает.

`System.exit` для него — обычный вызов метода.
"""

[[questions]]
id = "13fab0ae-dd37-4908-ad5a-9d811cd57f2d"
type = "MultipleChoice"
prompt.prompt = """
Зачем в сортировке добавлен `.thenComparing(Entry::word)`, если основной порядок
уже задан частотой через `comparingInt(Entry::count).reversed()`?
"""
answer.answer = "Чтобы слова с одинаковой частотой шли в предсказуемом порядке, а не по-разному от запуска к запуску."
prompt.distractors = [
  "Чтобы сортировка работала быстрее на больших словарях.",
  "Без него `reversed()` перевернул бы и слова тоже.",
  "Чтобы исключить из вывода слова с нулевой частотой."
]
context = """
Программа, печатающая на одних и тех же данных разное, неудобна и почти
непроверяема тестами: непонятно, что писать в ожидаемом результате.

Устойчивый порядок вывода — требование не эстетическое, а практическое.
"""

[[questions]]
id = "228f45b2-aae1-4185-89c3-d1c1478a93ae"
type = "MultipleChoice"
prompt.prompt = """
Почему подсчёт слов вынесен в отдельный метод `topWords`, который принимает
строку и возвращает список, вместо того чтобы считать и печатать прямо в `main`?
"""
answer.answer = "Так вычисление можно проверить тестами: метод, который читает файл, печатает и завершает программу, протестировать почти невозможно."
prompt.distractors = [
  "Так программа работает быстрее: `main` не тратит время на ввод-вывод.",
  "Иначе `main` не смог бы принимать аргументы командной строки.",
  "Это требование JUnit: тестируются только методы, возвращающие значение."
]
context = """
Общее правило: отделяйте вычисление от ввода-вывода. Вычисление тестируется,
ввод-вывод — нет. Чем больше программы попадает в первую часть, тем спокойнее её
менять.
"""

[[questions]]
id = "4833b556-0617-49da-8f7b-3bee2f6b6cd1"
type = "MultipleChoice"
prompt.prompt = """
Почему слова разрезаются регулярным выражением `[^\\p{L}]+`, а не просто по
пробелу?
"""
answer.answer = "Иначе знаки препинания остались бы приклеенными, и `окне.` считалось бы отдельным словом от `окне`."
prompt.distractors = [
  "Деление по пробелу не работает с кириллицей.",
  "`split` не принимает обычный пробел в качестве разделителя.",
  "Иначе пришлось бы отдельно обрабатывать переводы строк, а регулярное выражение их игнорирует."
]
context = """
`\\p{L}` означает «любая буква любого алфавита», `[^...]` — отрицание, `+` —
«одно или больше подряд». Так разом отсекаются пробелы, точки, запятые и
переводы строк, причём одинаково для кириллицы и латиницы.
"""

[[questions]]
id = "502fcb9b-e39a-42ba-aa4a-c1a7463c1ea3"
type = "MultipleChoice"
prompt.prompt = """
Почему программу пришлось перенести из компактного файла в обычный класс, чтобы
написать на неё тесты?
"""
answer.answer = "Неявный класс компактного файла не имеет имени, и обратиться к его методам из другого файла нельзя."
prompt.distractors = [
  "JUnit не умеет работать с записями, объявленными в компактном файле.",
  "В компактном файле нельзя объявлять `static`-методы, а тесты требуют их.",
  "Компактные файлы компилируются в память и `.class` не создают."
]
context = """
Компактная форма хороша, пока программа помещается в один файл и запускается
одной командой. Как только появляются тесты, она своё отслужила — и книга
переходит на обычные классы, как делает с главы 5.
"""
