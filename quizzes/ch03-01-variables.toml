[[questions]]
id = "daad8136-8e80-4573-87c7-bcc43355573a"
type = "MultipleChoice"
prompt.prompt = """
Переменная помечена `final` и хранит список. Что именно запрещает `final`?
"""
answer.answer = "Присвоить этой переменной другой список."
prompt.distractors = [
  "Добавлять и удалять элементы списка.",
  "И то и другое.",
  "Ничего: для ссылочных типов `final` не действует."
]
context = """
`final` фиксирует имя, а не содержимое. Переменная навсегда указывает на один и
тот же список — но сам список менять никто не мешает.

Разница станет наглядной в главе 4, когда мы разберём, что физически хранится в
переменной ссылочного типа.
"""

[[questions]]
id = "5456b837-9aa7-450f-a5da-a2c1387bed7a"
type = "MultipleChoice"
prompt.prompt = """
Эта программа не компилируется:

```java
void main() {
    int value = 1;
    {
        int value = 2;
        IO.println(value);
    }
}
```

Почему?
"""
answer.answer = "Java запрещает объявлять локальную переменную с именем, уже занятым в объемлющем методе."
prompt.distractors = [
  "Вложенный блок не имеет доступа к переменным внешнего блока.",
  "Внешняя `value` объявлена, но нигде не используется.",
  "Переменную во вложенном блоке нужно объявить как `final`."
]
context = """
Сообщение компилятора: `variable value is already defined in method main()`.

Во многих языках — C++, JavaScript, Rust — вложенное объявление создало бы новую
переменную, временно перекрывающую внешнюю. Это называется затенением, и Java
его для локальных переменных не допускает.

Решение спорное с точки зрения гибкости и удачное с точки зрения чтения: имя
внутри метода означает одно и то же от объявления до конца метода.
"""

[[questions]]
id = "97209c66-0186-4ca1-a5c1-7e3e6695402f"
type = "MultipleChoice"
prompt.prompt = """
Эта программа не компилируется:

```java
void main() {
    int n = 2;
    int count;
    if (n > 1) {
        count = 5;
    }
    IO.println(count);
}
```

Что именно не устроило компилятор?
"""
answer.answer = "Есть путь выполнения, на котором `count` не получает значения: ветки `else` нет."
prompt.distractors = [
  "`count` объявлена вне блока `if`, поэтому присвоить ей значение внутри нельзя.",
  "Переменную нельзя объявлять без начального значения.",
  "`count` не помечена `final`, а присваивается только в одной ветке."
]
context = """
Сообщение: `variable count might not have been initialized` — «возможно, не была
инициализирована». Компилятор требует гарантированного присваивания по всем
путям и в рассуждения вида «но ведь `n` равно двум» не пускается. Добавьте
`else count = 0;` — и программа соберётся.

Тонкость: если бы условие было **константным выражением** — `if (2 > 1)` или
`final int n = 2; if (n > 1)` — программа собралась бы. Такие условия компилятор
вычисляет заранее и знает, что ветка выполняется всегда. Достаточно убрать
`final`, и та же программа перестанет компилироваться.
"""

[[questions]]
id = "546743fb-5e00-4155-971b-1683f27850d8"
type = "ShortAnswer"
prompt.prompt = """
Каким ключевым словом объявляют локальную переменную, поручив вывод типа
компилятору?
"""
answer.answer = "var"
context = """
`var` работает только для локальных переменных с явной инициализацией. Это не
динамическая типизация: тип вычисляется при компиляции и проверяется как обычно.
"""
