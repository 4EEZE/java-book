[[questions]]
id = "426682f7-e2ff-4136-a7bf-4270ec7bf5c2"
type = "MultipleChoice"
prompt.prompt = """
Почему `Content-Length` считают как `response.body().getBytes(UTF_8).length`, а
не как `response.body().length()`?
"""
answer.answer = "Заголовок измеряется в байтах, а в UTF-8 русская буква занимает два байта — числа разойдутся."
prompt.distractors = [
  "`length()` не работает для многострочных строк.",
  "`getBytes` заодно проверяет строку на недопустимые символы.",
  "Разницы нет, это просто более явная запись."
]
context = """
Ошибётесь — клиент будет ждать недостающие байты или обрежет ответ. Для латиницы
числа совпадают, поэтому ошибка проявляется только на кириллице: классический
случай «на тестах работало».
"""

[[questions]]
id = "28d83e37-6974-464d-a9ed-6c28362f695f"
type = "MultipleChoice"
prompt.prompt = """
Что произойдёт, если в цикле приёма соединений вызывать `handle(socket)` прямо,
без запуска отдельного потока?
"""
answer.answer = "Пока обслуживается один клиент, цикл не дойдёт до следующего `accept()`, и остальные будут ждать."
prompt.distractors = [
  "Ничего: `accept()` продолжит принимать соединения в фоне.",
  "Сервер упадёт при втором одновременном подключении.",
  "Соединения будут теряться, но по одному сервер работать продолжит."
]
context = """
`accept()` блокирует выполнение до подключения, а `handle` — до конца
обслуживания. Один медленный клиент заблокирует всех.

Виртуальный поток здесь подходит идеально: сервер почти всё время ждёт, а
виртуальных потоков можно создавать по одному на соединение и не считать их.
"""

[[questions]]
id = "aad756a5-65f1-43c0-bd74-63f9d03abfd7"
type = "MultipleChoice"
prompt.prompt = """
Счётчик посещений объявлен как `AtomicLong`. Что изменится, если заменить его на
обычное поле `long` с операцией `visits++`?
"""
answer.answer = "Под параллельной нагрузкой часть посещений потеряется, и счётчик покажет меньше реального числа."
prompt.distractors = [
  "Ничего: каждое соединение обрабатывается в своём потоке и конфликта нет.",
  "Сервер будет выбрасывать исключение при одновременном доступе.",
  "Счётчик станет показывать больше реального числа из-за двойного учёта."
]
context = """
`visits++` — три действия: прочитать, прибавить, записать. Два потока успевают
прочитать одно значение и записать одинаковый результат — увеличение теряется.

Это гонка из главы 18 вживую. Двести параллельных запросов на `AtomicLong` дают
ровно двести; на обычном `long` — меньше, и каждый раз по-разному.
"""

[[questions]]
id = "96978312-9f54-495d-8ad4-9e2952ea76a6"
type = "MultipleChoice"
prompt.prompt = """
Почему сокет, читатель и писатель перечислены в одном `try` с ресурсами именно в
таком порядке — сокет первым?
"""
answer.answer = "Закрываются они в обратном порядке: сначала писатель сбрасывает буфер, и только потом закрывается сокет."
prompt.distractors = [
  "Порядок не важен: `try` закрывает ресурсы одновременно.",
  "Сокет обязан идти первым, потому что остальные получены из него.",
  "Так требует синтаксис: объявленные заранее переменные идут первыми."
]
context = """
Если бы сокет закрылся первым, сброс буфера писателя провалился бы и ответ не
ушёл.

Обратный порядок закрытия мы разбирали в главе 4 — там это было существенно по
той же причине: один ресурс зависит от другого.
"""

[[questions]]
id = "89ab8f9c-a9ee-4fea-a259-4d4fb823290b"
type = "MultipleChoice"
prompt.prompt = """
Зачем читать и выбрасывать заголовки запроса, если сервер ими не пользуется?
"""
answer.answer = "Иначе они останутся в буфере и следующее чтение получит мусор."
prompt.distractors = [
  "Иначе клиент не поймёт, что запрос принят, и повторит его.",
  "Чтения требует протокол: без него соединение считается некорректным.",
  "Незачем — эту часть можно убрать без последствий."
]
context = """
Конец заголовков в HTTP обозначается пустой строкой — до неё и читаем.

`null` из `readLine()` означает, что клиент закрыл соединение: знакомый по главе
2 конец ввода. Браузеры регулярно открывают соединение и сразу закрывают, так
что случай не теоретический.
"""

[[questions]]
id = "8cdbb697-6e87-45a2-8c0c-4af1fa982777"
type = "MultipleChoice"
prompt.prompt = """
Что из перечисленного **отсутствует** в написанном сервере и потребовалось бы
настоящему?
"""
answer.answer = "Тайм-ауты, ограничения на размер запроса, чтение тела и постоянные соединения."
prompt.distractors = [
  "Разбор строки запроса и заголовков.",
  "Указание кодировки в заголовке ответа.",
  "Закрытие сокета после ответа."
]
context = """
Клиент, открывший соединение и молчащий, займёт поток навсегда — лечится
`socket.setSoTimeout(...)`. Запрос в гигабайт заголовков съест память.

Писать HTTP-сервер вручную стоит ровно один раз — чтобы увидеть, что внутри нет
магии. В работе берут готовое.
"""
