[[questions]]
id = "14528fea-d62d-406e-8c46-b636863f6d33"
type = "MultipleChoice"
prompt.prompt = """
Программа читает ввод в цикле и перехватывает `NumberFormatException`, печатая
«это не число» и переходя к следующей итерации. Что произойдёт, если ввод
закончится (пользователь нажал Ctrl+D)?
"""
answer.answer = "Программа зациклится, бесконечно печатая «это не число»."
prompt.distractors = [
  "Программа завершится с `NullPointerException`.",
  "Программа завершится нормально: цикл закончится сам.",
  "Программа завершится с `NumberFormatException`."
]
context = """
`IO.readln` вернёт `null`, а `Integer.parseInt(null)` выбросит именно
`NumberFormatException` — то самое исключение, которое мы ловим. `catch`
его перехватит, `continue` отправит на новый круг, читать снова будет нечего.

Это главный урок раздела: слишком широкий перехват превратил внятную аварию в
тихое неправильное поведение.
"""

[[questions]]
id = "c329fc64-aedb-44dc-bc0c-586feefec587"
type = "Tracing"
prompt.program = """
void main() {
    int a = 2;
    int b = 3;
    IO.println("сумма: " + a + b);
}
"""
answer.doesCompile = true
answer.stdout = "сумма: 23"
context = """
Плюс вычисляется слева направо. `"сумма: " + a` даёт строку `"сумма: 2"`, и
следующий плюс приклеивает к строке `b` — получается `"сумма: 23"`, а не 5.

Чтобы сложить числа, их нужно сгруппировать скобками: `"сумма: " + (a + b)`.
Это одна из самых частых опечаток в Java, и компилятор о ней не предупреждает —
код совершенно корректен, просто делает не то.
"""

[[questions]]
id = "225294be-5c5b-4118-a24a-e4e7a112bdd9"
type = "MultipleChoice"
prompt.prompt = """
Эта программа не компилируется:

```java
void main() {
    try {
        int число = Integer.parseInt("5");
    } catch (NumberFormatException e) {
        IO.println("не число");
    }
    IO.println(число);
}
```

Что именно не устроило компилятор?
"""
answer.answer = "`число` объявлена внутри блока `try` и за его фигурными скобками не существует."
prompt.distractors = [
  "Существует путь выполнения, на котором `число` не получает значения.",
  "Значение из блока `try` нельзя использовать после перехвата исключения.",
  "`Integer.parseInt` может выбросить исключение, поэтому результат нужно проверить до использования."
]
context = """
Компилятор сообщит `cannot find symbol`: переменной с таким именем в этой точке
просто нет. Переменная живёт только в тех фигурных скобках, где объявлена.

Первый неверный вариант описывает другую, очень похожую претензию компилятора —
`variable might not have been initialized`. Она возникла бы, если объявить
`int число;` **до** `try`, а присвоить внутри: тогда переменная существует, но
на пути через `catch` остаётся без значения. Различать эти два случая полезно:
в первом переменной нет, во втором она есть, но пуста.
"""

[[questions]]
id = "e9be2669-8c43-4c24-a31b-d583f16d2863"
type = "ShortAnswer"
prompt.prompt = """
Какое ключевое слово немедленно прерывает цикл, а какое — переходит к следующей
итерации? Напишите два слова через пробел, в этом порядке.
"""
answer.answer = "break continue"
answer.alternatives = ["break, continue", "break и continue"]
context = """
`break` выходит из цикла целиком, `continue` бросает текущую итерацию и
начинает следующую. В игре `break` завершал игру после угаданного числа, а
`continue` просил ввести значение заново.
"""

[[questions]]
id = "822bb838-09ad-4d8c-a1be-8707da48084d"
type = "Tracing"
prompt.program = """
import java.util.Random;

void main() {
    Random r = new Random(42);
    IO.println(r.nextInt(1, 101));
    Random s = new Random(42);
    IO.println(s.nextInt(1, 101));
}
"""
answer.doesCompile = true
answer.stdout = """
31
31
"""
context = """
`Random` выдаёт псевдослучайные числа: последовательность полностью определена
начальным состоянием. Два генератора с одним и тем же начальным значением дают
одинаковые результаты — на этом основано воспроизводимое тестирование кода со
случайностью.

По той же причине `Random` не годится для паролей и ключей: там нужен
`SecureRandom`.
"""
