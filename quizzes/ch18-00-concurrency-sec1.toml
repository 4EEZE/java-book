[[questions]]
id = "bdab8467-d6e7-4603-b32a-1f982989a34f"
type = "MultipleChoice"
prompt.prompt = """
Два потока по 100 000 раз выполняют `counter++` над общим полем. Итог получается
то 193235, то 195892 — каждый раз разный и меньше 200000. Почему?
"""
answer.answer = "`counter++` — это три действия: прочитать, прибавить, записать. Потоки успевают прочитать одно значение и записать одинаковый результат."
prompt.distractors = [
  "Часть увеличений не успевает выполниться до завершения программы.",
  "Целочисленное поле переполняется и часть значений теряется.",
  "Второй поток перезаписывает поле начальным значением при старте."
]
context = """
Это **гонка**: результат зависит от порядка, в котором потоки успели выполнить
свои шаги, а порядок непредсказуем.

Самое неприятное — программа не падает и не сообщает об ошибке. Она выдаёт
правдоподобное число, почти правильное, и заметить подвох можно только зная,
каким оно должно быть.
"""

[[questions]]
id = "975f58a9-a3c5-43fd-907b-b24a6134eec9"
type = "MultipleChoice"
prompt.prompt = """
Достаточно ли пометить счётчик как `volatile`, чтобы `counter++` из двух потоков
перестал терять увеличения?
"""
answer.answer = "Нет: `volatile` решает задачу видимости, но не делает операцию неделимой."
prompt.distractors = [
  "Да: `volatile` запрещает двум потокам одновременно обращаться к переменной.",
  "Да, но только для `int`; для `long` нужен ещё и `synchronized`.",
  "Нет: `volatile` вообще не относится к многопоточности, он про оптимизацию."
]
context = """
`volatile` заставляет читать и писать переменную из общей памяти, не кешируя и
не переупорядочивая вокруг неё. Но три шага «прочитать, прибавить, записать»
остаются тремя шагами, и между ними поток по-прежнему прерывается.

Для счётчика берут `AtomicInteger` или `synchronized`.
"""

[[questions]]
id = "ee77f64b-7928-4894-aa5c-dcf27fe8e8ec"
type = "MultipleChoice"
prompt.prompt = """
Поток крутит `while (running) { }`, а другой поток выставляет `running = false`.
Поле не помечено `volatile`. Что может произойти?
"""
answer.answer = "Первый поток может никогда не увидеть изменения и крутиться вечно."
prompt.distractors = [
  "Программа упадёт с исключением при одновременном доступе к полю.",
  "Цикл завершится, но с задержкой в несколько секунд.",
  "Ничего особенного: `boolean` читается и пишется атомарно, этого достаточно."
]
context = """
Каждое ядро работает со своим кешем, и записанное одним потоком значение может
не дойти до другого. Вдобавок компилятор и процессор вправе переупорядочивать
действия: для **одного** потока результат тот же, а другой поток видит
происходящее без сглаживания.

Атомарность чтения `boolean` тут ни при чём — проблема в видимости, и решает её
`volatile`.
"""

[[questions]]
id = "a6788a35-59d6-48a9-a70f-fc780da21bad"
type = "MultipleChoice"
prompt.prompt = """
Один поток делает `synchronized (a)`, внутри — `synchronized (b)`. Другой берёт
их в обратном порядке. Чем это грозит?
"""
answer.answer = "Взаимной блокировкой: каждый захватил своё и ждёт чужое, оба ждут вечно."
prompt.distractors = [
  "Ничем: Java обнаруживает такую ситуацию и снимает одну из блокировок.",
  "Один из потоков получит `IllegalMonitorStateException`.",
  "Потоки будут работать медленнее, но в итоге оба завершатся."
]
context = """
Программа не падает и ничего не сообщает — она просто перестаёт отвечать.

Основное средство — **единый порядок захвата**: если все потоки берут блокировки
в одном и том же порядке, круговое ожидание невозможно.
"""
