[[questions]]
id = "661d74aa-da9f-4248-b96f-41b608a0c2d7"
type = "MultipleChoice"
prompt.prompt = """
Почему поток от `Files.lines(path)` обязательно оборачивают в `try` с ресурсами,
а поток от `list.stream()` — нет?
"""
answer.answer = "За потоком строк стоит открытый файл, и его надо закрыть; за потоком от коллекции ничего такого нет."
prompt.distractors = [
  "Потому что `Files.lines` возвращает бесконечный поток.",
  "Потому что иначе строки будут прочитаны все сразу и память переполнится.",
  "Потому что файловые потоки нельзя обходить лениво без явного закрытия."
]
context = """
Забыть `try` легко, потому что программа продолжит работать: файловый
дескриптор просто останется занятым. На сотне вызовов это незаметно, на десятках
тысяч — «слишком много открытых файлов».

Правило: метод вернул поток, связанный с файловой системой, — оборачивайте.
Это касается и `Files.list`, и `Files.walk`.
"""

[[questions]]
id = "5d8aef56-10da-45b9-b2fe-2f64ea3d4a8a"
type = "Tracing"
prompt.program = """
import java.nio.file.*;

void main() throws Exception {
    Path path = Path.of("данные.txt");
    Files.writeString(path, "первая");
    Files.writeString(path, "вторая");
    IO.println(Files.readString(path));
}
"""
answer.doesCompile = true
answer.stdout = "вторая"
context = """
`writeString` по умолчанию **перезаписывает** файл целиком, а не дописывает.
Первая строка исчезла бесследно.

Чтобы дописать в конец, это говорят явно:
`Files.writeString(path, текст, StandardOpenOption.APPEND)`.

Умолчание выбрано удачно: случайно затереть файл неприятно, но заметно сразу, а
случайно дописать — незаметно и потому хуже.
"""

[[questions]]
id = "9fe596f2-8c98-4b27-80e6-75ad22626322"
type = "MultipleChoice"
prompt.prompt = """
Почему путь собирают через `Path.of("/etc").resolve("app")`, а не склейкой
строк `"/etc" + "/" + "app"`?
"""
answer.answer = "`resolve` знает разделитель текущей операционной системы, а склейка ломается там, где он другой."
prompt.distractors = [
  "`resolve` проверяет, что такой файл существует, а склейка — нет.",
  "Склейка строк работает медленнее из-за создания промежуточных объектов.",
  "`Path.of` принимает только один сегмент пути, поэтому иначе не получится."
]
context = """
`Path` описывает путь, а не файл: объект создаётся успешно, даже если по этому
пути ничего нет. Существование проверяется отдельно — `Files.exists`.
"""

[[questions]]
id = "d11d6a61-5884-4858-a7e2-c2f7c1a46598"
type = "MultipleChoice"
prompt.prompt = """
Чем связка «проверить `Files.exists(path)`, затем открыть файл» хуже, чем просто
открыть и обработать исключение?
"""
answer.answer = "Между проверкой и открытием файл могут удалить — проверка ничего не гарантирует, а кода становится больше."
prompt.distractors = [
  "`Files.exists` возвращает `true` и для каталогов, поэтому проверка бессмысленна.",
  "`Files.exists` работает медленно, так как читает содержимое файла.",
  "Ничем: такая проверка и есть рекомендуемый способ."
]
context = """
Это общий приём: там, где состояние может измениться между проверкой и
действием, надёжнее действовать и обрабатывать отказ. Так короче и честнее.
"""

[[questions]]
id = "691dfc6a-8e4b-49a4-9dde-3a176cdef974"
type = "MultipleChoice"
prompt.prompt = """
Начиная с какой версии Java кодировка по умолчанию стала UTF-8 на всех
платформах, и почему это важно?
"""
answer.answer = "С Java 18: до этого кодировка зависела от системы, и один код на Windows и Linux читал файлы по-разному."
prompt.distractors = [
  "С Java 8: до этого текстовые файлы вообще нельзя было читать как строки.",
  "С Java 21: до этого приходилось всегда указывать кодировку явно.",
  "Кодировка по умолчанию до сих пор зависит от системы."
]
context = """
Это была классическая причина «у меня работает, а у тебя кракозябры».

Правило остаётся: свои файлы пишите в UTF-8, а кодировку чужих узнавайте заранее
и указывайте явно. Кодировка — не то, о чём стоит догадываться.
"""

[[questions]]
id = "0d68b2f9-a15d-4d7b-9dcc-02e44dbbdaf2"
type = "MultipleChoice"
prompt.prompt = """
Чем `Files.delete(path)` из `java.nio.file` лучше, чем `file.delete()` из
старого `java.io`?
"""
answer.answer = "При неудаче он бросает исключение с объяснением причины, а старый просто возвращает `false`."
prompt.distractors = [
  "Он удаляет непустые каталоги, а старый — только файлы.",
  "Он работает быстрее, потому что не обращается к файловой системе дважды.",
  "Он удаляет файл атомарно, а старый может оставить его наполовину удалённым."
]
context = """
`false` не говорит **почему**: не было прав, файла не существовало, каталог не
пуст. Разбираться приходится самому.

Старый набор всё же придётся знать — он повсюду в существующем коде. Переход
между ними делается одним вызовом: `file.toPath()` и `path.toFile()`.
"""
