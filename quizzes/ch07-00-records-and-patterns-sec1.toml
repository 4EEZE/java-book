[[questions]]
id = "297a33e7-f765-4214-a2ff-0d0666e70ab6"
type = "Tracing"
prompt.program = """
record Point(int x, int y) {}

void main() {
    Point a = new Point(1, 2);
    Point b = new Point(1, 2);
    IO.println(a.equals(b));
    IO.println(a == b);
    IO.println(a);
}
"""
answer.doesCompile = true
answer.stdout = """
true
false
Point[x=1, y=2]
"""
context = """
`equals` у записи сравнивает по содержимому и написан компилятором — поэтому
`true`. А `==` по-прежнему спрашивает «это один и тот же объект?», и объекты
здесь разные.

`toString` тоже даётся бесплатно: имя записи и все поля. Обычный класс напечатал
бы что-то вроде `Point@1b6d3586`.
"""

[[questions]]
id = "b6fe6ace-6446-4319-820f-64f08d644998"
type = "MultipleChoice"
prompt.prompt = """
В компактном конструкторе записи `Book(String title, int year)` написано
`title = title.trim();`. Что именно присваивается?
"""
answer.answer = "Параметр: поле компилятор заполнит сам после конструктора, уже очищенным значением."
prompt.distractors = [
  "Поле: в компактном конструкторе `this` можно не писать.",
  "Ничего: поля записи `final`, поэтому строка не имеет эффекта.",
  "Локальная переменная, а поле останется с исходным значением."
]
context = """
У компактного конструктора нет списка параметров и нет присваиваний полям —
присвоит их компилятор, и **после** вашего кода. Поэтому изменение параметра
попадает в поле.

Так записи нормализуют входные данные: обрезают пробелы, приводят регистр,
заменяют `null` на пустое значение.
"""
